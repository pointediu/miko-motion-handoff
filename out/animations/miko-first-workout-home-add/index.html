</script><script>// Pointer cancellation and keyboard activation use the same MVP press feedback.
document.querySelectorAll('[data-press]').forEach(button=>{
 const surface=button.dataset.pressSurface?document.querySelector(button.dataset.pressSurface):button;
 let releaseTimer;
 const press=()=>{if(button.disabled||button.hidden||button.closest('[inert]')||document.querySelector('[aria-busy="true"]'))return;clearTimeout(releaseTimer);surface.classList.remove('is-releasing');surface.classList.add('is-pressing');};
 const release=()=>{if(!surface.classList.contains('is-pressing'))return;surface.classList.remove('is-pressing');surface.classList.add('is-releasing');releaseTimer=setTimeout(()=>surface.classList.remove('is-releasing'),320);};
 button.addEventListener('pointerdown',press);
 ['pointerup','pointercancel','pointerleave','blur'].forEach(event=>button.addEventListener(event,release));
 button.addEventListener('keydown',event=>{if(!event.repeat&&['Enter',' '].includes(event.key))press();});
 button.addEventListener('keyup',release);
});
</script></body></html>
