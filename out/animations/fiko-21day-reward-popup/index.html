<script>
(function(root){
'use strict';
// Times are milliseconds; positions are points on the 393 x 852 reference canvas.
const spec={
 id:'fiko-21day-reward-popup',durationMs:1500,figmaNode:'37:28417',
 canvas:{widthPt:393,heightPt:852},
 layout:{card:{x:36.5,y:219,width:321,height:415,radius:32},heading:{x:76.5,y:251,width:241,height:24},title:{x:76.5,y:283,width:241,height:36},stage:{x:97,y:335,width:200,height:200,radius:26.556},prize:{x:107.283203125,y:345,width:180,height:180},button:{x:88,y:554,width:220,height:60,radius:26},close:{x:301.5,y:235,width:40,height:40}},
 easing:{name:'easeOutCubic',formula:'1 - (1 - progress)^3',swiftUI:'Animation.timingCurve(0.333333, 1, 0.666667, 1, duration: seconds)'},
 tracks:{
  maskOpacity:[[0,0],[180,.5]],cardOpacity:[[0,0],[200,1]],cardScale:[[0,.94],[260,1.018],[420,1]],cardY:[[0,18],[360,0]],
  headingOpacity:[[0,0],[120,0],[320,1]],titleOpacity:[[0,0],[180,0],[400,1]],
  prizeOpacity:[[0,0],[180,0],[300,1]],prizeScale:[[0,.56],[180,.56],[480,1.10],[650,.985],[800,1]],prizeY:[[0,16],[180,16],[480,-7],[780,0]],prizeRotation:[[0,-8],[180,-8],[480,2.5],[760,0]],
  buttonOpacity:[[0,0],[500,0],[780,1]],buttonY:[[0,8],[500,8],[800,0]],closeOpacity:[[0,0],[320,0],[520,1]]
 },
 confetti:{count:12,startMs:360,staggerMs:30,staggerGroups:3,lifetimeMs:1080,completeMs:1500,centerPt:[197.283203125,435],colors:['#9EC6FF','#BBD9FF','#F4DDA7','#F5CBC1'],angleStepDeg:137.508,angleOffsetDeg:-115,initialRadiusPt:38,travelBasePt:88,travelStepPt:19,gravityPt:70,spinDeg:210,fadeInProgress:.08,fadeOutStartProgress:.62,widthBasePt:4,widthStepPt:1.2,heightBasePt:7,heightStepPt:1.5},
 interaction:{autoplay:true,replay:'交付页「重播 / 刷新」；关闭后点击原活动页礼物入口',closeDurationMs:160,buttonPress:{downMs:90,releaseMs:200,scale:.97,translateYPt:1.5},viewPrize:'dispatch reward:view-prize; production navigation supplied by host'},
 reducedMotion:{durationMs:180,particles:false,scale:false,rotation:false,translation:false},
 haptics:{recommendedTimeMs:480,type:'light impact, once',enabledInWebPreview:false},
 sourceOfValues:{layout:'Figma 37:28417',animation:'New motion authored for the requested 1.5 second sticker pop and sparse confetti'}
};
const clamp=(x,min=0,max=1)=>Math.min(max,Math.max(min,x));
const ease=p=>1-Math.pow(1-clamp(p),3);
function sample(track,time){if(time<=track[0][0])return track[0][1];for(let i=1;i<track.length;i++){const [end,to]=track[i], [start,from]=track[i-1];if(time<=end)return from+(to-from)*ease((time-start)/(end-start));}return track.at(-1)[1];}
function pose(time,reduced=false){const t=clamp(Number(time)||0,0,spec.durationMs);const result=Object.fromEntries(Object.entries(spec.tracks).map(([key,track])=>[key,sample(track,reduced?spec.durationMs:t)]));if(reduced){const fade=clamp(t/spec.reducedMotion.durationMs);result.cardOpacity=fade;result.maskOpacity=.5*fade;}return result;}
function particles(time,reduced=false){if(reduced)return [];const c=spec.confetti,out=[];for(let i=0;i<c.count;i++){
 const p=(time-c.startMs-(i%c.staggerGroups)*c.staggerMs)/c.lifetimeMs;if(p<=0||p>=1)continue;
 const angle=(i*c.angleStepDeg+c.angleOffsetDeg)*Math.PI/180,r=c.initialRadiusPt+ease(p)*(c.travelBasePt+(i%4)*c.travelStepPt),opacity=clamp(p/c.fadeInProgress)*(1-clamp((p-c.fadeOutStartProgress)/(1-c.fadeOutStartProgress)));
 out.push({id:i,x:c.centerPt[0]+Math.cos(angle)*r,y:c.centerPt[1]+Math.sin(angle)*r+c.gravityPt*p*p,rotation:i*29+(i%2?-1:1)*c.spinDeg*p,scaleX:.55+.45*Math.abs(Math.cos(p*Math.PI*2)),width:c.widthBasePt+(i%3)*c.widthStepPt,height:c.heightBasePt+(i%3)*c.heightStepPt,opacity,color:c.colors[i%c.colors.length]});
}return out;}
const api={spec,sample,pose,particles,ease};root.RewardPopupMotion=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
(function(){
'use strict';
const M=window.RewardPopupMotion,$=id=>document.getElementById(id),canvas=$('confetti'),ctx=canvas.getContext('2d'),media=matchMedia('(prefers-reduced-motion: reduce)');
let time=0,last=0,raf=0,phase='closed',paused=false,resumeOnVisible=false,reduced=media.matches,closeAt=0,closingPose=null;
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/393,innerHeight/852).toFixed(5));}
function render(at){
 let p=M.pose(at,reduced);if(phase==='closing'){const f=1-Math.min(closeAt/M.spec.interaction.closeDurationMs,1);p={...closingPose,cardOpacity:closingPose.cardOpacity*f,maskOpacity:closingPose.maskOpacity*f};}
 $('mask').style.opacity=p.maskOpacity;$('card').style.opacity=p.cardOpacity;$('card').style.transform=`translateY(${p.cardY}px) scale(${p.cardScale})`;
 $('heading').style.opacity=p.headingOpacity;$('title').style.opacity=p.titleOpacity;$('prize').style.opacity=p.prizeOpacity;$('prize').style.transform=`translateY(${p.prizeY}px) rotate(${p.prizeRotation}deg) scale(${p.prizeScale})`;
 $('viewPrize').style.opacity=p.buttonOpacity;$('viewPrize').style.transform=`translateY(${p.buttonY}px)`;$('viewPrize').disabled=phase==='closing'||at<(reduced?180:500);$('closeReward').style.opacity=p.closeOpacity;
 ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,393,852);
 if(phase==='closing'||phase==='closed')return;
 for(const q of M.particles(at,reduced)){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rotation*Math.PI/180);ctx.scale(q.scaleX,1);ctx.globalAlpha=q.opacity;ctx.fillStyle=q.color;ctx.fillRect(-q.width/2,-q.height/2,q.width,q.height);ctx.restore();}
}
function finishClose(){phase='closed';$('card').hidden=true;$('mask').hidden=true;$('openReward').hidden=false;$('openReward').focus();ctx.clearRect(0,0,393,852);}
function step(now){raf=0;if(paused||document.hidden)return;const delta=last?Math.max(0,now-last):0;last=now;
 if(phase==='closing'){closeAt+=delta;render(time);if(closeAt>=M.spec.interaction.closeDurationMs){finishClose();return;}}
 else if(phase==='opening'){time=Math.min(time+delta,reduced?180:1500);render(time);if(time>=(reduced?180:1500)){phase='open';return;}}
 else return;raf=requestAnimationFrame(step);
}
function play(){cancelAnimationFrame(raf);raf=0;last=0;paused=false;if(document.hidden){resumeOnVisible=true;return;}raf=requestAnimationFrame(step);}
function replay(){cancelAnimationFrame(raf);phase='opening';time=0;closeAt=0;$('card').hidden=false;$('mask').hidden=false;$('openReward').hidden=true;render(0);$('card').focus({preventScroll:true});play();}
function close(){if(!['opening','open'].includes(phase))return;closingPose=M.pose(time,reduced);phase='closing';closeAt=0;play();}
$('closeReward').addEventListener('click',close);$('openReward').addEventListener('click',replay);
$('viewPrize').addEventListener('click',()=>{if(!$('viewPrize').disabled)window.dispatchEvent(new CustomEvent('reward:view-prize',{detail:{prize:'Miko 实物贴纸',source:'37:28417'}}));});
document.addEventListener('keydown',event=>{if(phase==='closed')return;if(event.key==='Escape'){event.preventDefault();close();}if(event.key==='Tab'){const first=$('closeReward'),last=$('viewPrize');if(last.disabled){event.preventDefault();first.focus();}else if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('card'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===$('card'))){event.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){resumeOnVisible=['opening','closing'].includes(phase)&&!paused;paused=true;cancelAnimationFrame(raf);}else if(resumeOnVisible){resumeOnVisible=false;play();}});
media.addEventListener('change',event=>{reduced=event.matches;if(phase!=='closed')replay();});window.addEventListener('resize',fit);window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);paused=true;});
window.RewardPopupDemo={replay,close,seek(ms){cancelAnimationFrame(raf);paused=true;phase='open';time=Math.max(0,Math.min(1500,Number(ms)||0));$('card').hidden=false;$('mask').hidden=false;$('openReward').hidden=true;render(time);},state:()=>({time,phase,paused,reduced,particles:M.particles(time,reduced).length}),spec:M.spec};
fit();Promise.allSettled([...document.images].map(img=>img.decode?img.decode():Promise.resolve())).then(replay);
})();
</script></body></html>
