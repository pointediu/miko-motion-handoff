<template id="videoTemplate"><video id="workout" src="../../assets/8df3c39ecb0cc0d8ac69cb033f7a4bd84f3158e45d2510fab604799bc3ce2c61.mp4" muted loop playsinline preload="auto" aria-label="女性动作循环演示"></video><span class="video-message" id="videoMessage"></span></template>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)'),pages=[$('plan'),$('invite'),$('choose'),$('homeScreen')],cards=[...document.querySelectorAll('.posture')];
const videos=cards.map((card,i)=>{const fragment=$('videoTemplate').content.cloneNode(true);const v=fragment.querySelector('video');v.id='workout-'+i;v.muted=true;v.poster='../../assets/f4a150a77b178a6d3f620c60528da2d5d73c25e4731cdb7d1a03adf041fa674f.png';fragment.querySelector('.video-message').removeAttribute('id');card.querySelector('.video-wrap').append(fragment);return v;});
let step=0,selected=-1,generation=0,busy=false,playingBeforeHidden=false,animations=new Set(),timers=[],raf=0,last=0;
const dotSrc='../../assets/d12f5ae6337437626a7a4f4679c324157d907f4d5abf97fd964a3808a0af271a.svg';for(let i=0;i<1856;i++){const im=new Image();im.src=dotSrc;im.alt='';im.width=2;im.height=2;$('dots').append(im);}
function fit(){document.documentElement.style.setProperty('--scale',Math.max(.1,Math.min(innerWidth/393,innerHeight/852)).toFixed(6));}addEventListener('resize',fit);fit();
function pump(now){raf=0;if(document.hidden)return;const dt=last?Math.min(64,now-last):0;last=now;for(const t of [...timers]){t.left-=dt;if(t.left<=0){timers=timers.filter(x=>x!==t);t.done(true);}}if(timers.length)raf=requestAnimationFrame(pump);}
function delay(ms){return new Promise(done=>{timers.push({left:ms,done});if(!raf){last=0;raf=requestAnimationFrame(pump);}});}
// Shared values mirror the existing ob2-iteration preview.
const OB={ease:'cubic-bezier(.4,0,.2,1)',enter:680,exit:240,sharedCat:760,guideDelay:130,guideGap:42,guideChar:130,introDelay:650,introGap:82,subtitleGap:72,linePause:220,mouth:190,card:520};
const cat=$('guideCat'),headingIds=['planHeading','inviteHeading','chooseHeading'];
const copy=[['计划出炉～','敢不敢和我做个约定！'],['现在，和Miko轻轻动 1分钟','找找感觉吧！'],['选择当下就能练的姿势吧','随时随地轻轻开始~']];
const emphasis=[['约定'],['轻轻动','1分钟'],['轻轻开始']];
copy.forEach((lines,n)=>{const h=$(headingIds[n]);let phase=0;lines.forEach(line=>{const row=document.createElement('span');row.className='typed-line';row.setAttribute('aria-hidden','true');[...line].forEach((char,i)=>{const c=document.createElement('span');c.className='typed-char';c.textContent=char===' '?'\u00a0':char;if(emphasis[n].some(key=>{const x=line.indexOf(key);return x>=0&&i>=x&&i<x+key.length;})){c.classList.add('emphasis');c.style.setProperty('--phase',(-200*phase++)+'ms');}row.append(c);});h.append(row);});});
function pageIndex(n){return n===3?2:n===4?3:n;}
function motion(el,frames,duration,easing=OB.ease){
 if(reduced.matches){const end={...frames.at(-1)};delete end.offset;Object.assign(el.style,end);return Promise.resolve();}
 const a=el.animate(frames,{duration,easing,fill:'both'});animations.add(a);if(document.hidden)a.pause();return a.finished.then(()=>{a.commitStyles();a.cancel();animations.delete(a);},()=>animations.delete(a));
}
function setBusy(value){busy=value;$('cards').setAttribute('aria-busy',String(value));}
function stopVideos(){videos.forEach(v=>v.pause());playingBeforeHidden=false;}
function stopSpeaking(){cat.classList.remove('is-speaking');}
function finishCopy(){document.querySelectorAll('.typed-char').forEach(c=>{c.classList.add('visible');c.style.opacity='';c.style.transform='';});stopSpeaking();}
function cancel(){generation++;setBusy(false);for(const a of animations)a.cancel();animations.clear();for(const t of timers)t.done(false);timers=[];cancelAnimationFrame(raf);raf=0;last=0;stopVideos();finishCopy();}
function markNav(n){step=n;$('back').hidden=n===1||n===4;$('back').setAttribute('aria-label',n>=2?'返回首页':'返回上一个演示状态');}
function catPose(n){return n===1?'translate(124.62px,404.63px) scale(1.92015,1.925)':'translate(18.4px,'+(n===0?130.6:120.6)+'px) scale(1)';}
function background(n){$('planBackground').style.opacity=n===0?'.2':'0';$('dots').style.opacity=n===0?'0':'1';document.querySelector('.veil').style.opacity=n===4?'0':'1';}
function showPage(n){const index=pageIndex(n);pages.forEach((p,i)=>{p.hidden=i!==index;p.inert=i!==index;p.style.opacity='1';p.style.transform='none';});background(n);markNav(n);cat.style.transform=catPose(n);cat.style.opacity=n===4?'0':'1';}
function resetCopy(n){if(n>2)return;$(headingIds[n]).querySelectorAll('.typed-char').forEach(c=>{c.classList.remove('visible');c.style.opacity='';c.style.transform='';});}
async function typeCopy(n,token){
 if(n>2)return;resetCopy(n);if(reduced.matches){finishCopy();return;}
 if(n===1){if(!await delay(470)||token!==generation)return;cat.classList.add('is-speaking');if(!await delay(180)||token!==generation)return;}
 else {cat.classList.add('is-speaking');if(!await delay(OB.guideDelay)||token!==generation)return;}
 const rows=[...$(headingIds[n]).querySelectorAll('.typed-line')];
 for(let line=0;line<rows.length;line++){
  const gap=n===1?(line===0?OB.introGap:OB.subtitleGap):OB.guideGap,duration=n===1?(line===0?180:170):OB.guideChar;
  for(const c of rows[line].children){if(token!==generation)return;c.classList.add('visible');motion(c,[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],duration,'ease').then(()=>{if(token===generation){c.style.opacity='';c.style.transform='';}});if(!await delay(gap)||token!==generation)return;}
  if(line<rows.length-1&&(!await delay(n===1?OB.linePause:OB.guideGap)||token!==generation))return;
 }
 if(await delay(n===1?220:130)&&token===generation)stopSpeaking();
}
function geometry(i,expanded){return {top:expanded?i*68+(i>selected?254:0):i*124,height:expanded?(i===selected?312:58):114};}
function labelVisibility(card,expanded,open){for(const cls of ['.card-sub','.card-icon'])card.querySelector(cls).setAttribute('aria-hidden',String(expanded));card.querySelector('.compact-sub').setAttribute('aria-hidden',String(!expanded||open));card.querySelector('.details').setAttribute('aria-hidden',String(!open));card.setAttribute('aria-expanded',String(open));}
function layout(expanded){$('cards').style.top=(expanded?226:269)+'px';cards.forEach((c,i)=>{const open=expanded&&i===selected,g=geometry(i,expanded);Object.assign(c.style,{top:g.top+'px',height:g.height+'px'});Object.assign(c.querySelector('.card-title').style,{top:(expanded?(open?18:17):33)+'px',left:(open?30:29)+'px'});Object.assign(c.querySelector('.card-bg').style,{borderWidth:(open?2:1)+'px',borderColor:open?'#000':'#ededed'});for(const cl of ['.card-sub','.card-icon'])c.querySelector(cl).style.opacity=expanded?'0':'1';c.querySelector('.compact-sub').style.opacity=expanded&&!open?'1':'0';c.querySelector('.details').style.opacity=open?'1':'0';labelVisibility(c,expanded,open);});$('try').classList.toggle('is-ready',expanded);}
function playSelected(manual=false){if(step!==3||selected<0||document.hidden||(!manual&&reduced.matches))return;const i=selected;videos[i].play().then(()=>{if(step!==3||selected!==i)videos[i].pause();}).catch(()=>{cards[i].querySelector('.video-message').textContent='点击卡片播放动作';});}

function goto(n){cancel();selected=n===3?0:-1;showPage(n);layout(n===3);Object.assign($('stamp').style,{transform:'none',opacity:'1'});$('stamp').disabled=false;$('paper').style.transform='none';Object.assign($('mark').style,{opacity:'.5',transform:'none'});if(n===3){videos[0].currentTime=0;playSelected();}}
async function transition(n,token,direction='forward'){
 if(token!==generation)return;setBusy(true);stopSpeaking();stopVideos();const oldStep=step,old=pages[pageIndex(step)],next=pages[pageIndex(n)],sign=direction==='back'?-1:1,shared=oldStep===1&&n===2;old.inert=true;
 await Promise.all([motion(old,[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY('+(-20*sign)+'px)'}],shared?180:OB.exit),shared?Promise.resolve():motion(cat,[{opacity:1},{opacity:0}],OB.exit)]);
 if(token!==generation)return;old.hidden=true;next.hidden=false;next.inert=false;background(n);markNav(n);resetCopy(n);if(n===0){selected=-1;layout(false);Object.assign($('stamp').style,{transform:'none',opacity:'1'});$('stamp').disabled=false;Object.assign($('mark').style,{opacity:'.5',transform:'none'});}
 const entry=motion(next,[{opacity:0,transform:'translateY('+(40*sign)+'px)'},{opacity:1,transform:'translateY(0)'}],OB.enter);
 if(shared){await motion(cat,[{transform:catPose(1)},{transform:catPose(2)}],OB.sharedCat);if(token!==generation)return;await delay(40);}
 else if(n!==4){cat.style.transform=catPose(n);if(n===1){motion(cat,[{opacity:0,transform:'translate(124.62px,444.63px) scale(1.92015,1.925)'},{opacity:1,transform:catPose(n)}],OB.enter);}else motion(cat,[{opacity:0},{opacity:1}],OB.enter);}
 const typing=typeCopy(n,token);await entry;if(token!==generation)return;setBusy(false);await typing;
}
async function selectPosture(index,token){selected=index;setBusy(true);markNav(3);stopVideos();videos[index].currentTime=0;$('try').classList.add('is-ready');const jobs=[motion($('cards'),[{top:$('cards').style.top},{top:'226px'}],OB.card)];cards.forEach((c,i)=>{const open=i===index,g=geometry(i,true);jobs.push(motion(c,[{top:c.style.top,height:c.style.height},{top:g.top+'px',height:g.height+'px'}],OB.card));const title=c.querySelector('.card-title');jobs.push(motion(title,[{top:title.style.top,left:title.style.left},{top:(open?18:17)+'px',left:(open?30:29)+'px'}],OB.card));for(const cl of ['.card-sub','.card-icon']){const el=c.querySelector(cl);jobs.push(motion(el,[{opacity:el.style.opacity},{opacity:0}],140));}const sub=c.querySelector('.compact-sub');jobs.push(motion(sub,[{opacity:sub.style.opacity},{opacity:open?0:1}],300));const detail=c.querySelector('.details');jobs.push(motion(detail,[{opacity:detail.style.opacity},{opacity:0,offset:open ? .25 : 0},{opacity:open?1:0}],open?OB.card:140));Object.assign(c.querySelector('.card-bg').style,{borderWidth:(open?2:1)+'px',borderColor:open?'#000':'#ededed'});labelVisibility(c,true,open);});await Promise.all(jobs);if(token!==generation)return;layout(true);setBusy(false);playSelected();}

async function stampPlan(token){setBusy(true);$('stamp').disabled=true;const stamp=motion($('stamp'),[{transform:'translateY(0) scale(1)',offset:0},{transform:'translateY(-64px) scale(.98)',offset:.36},{transform:'translateY(-60px) scale(1.01)',offset:.48},{transform:'translateY(6px) scale(1)',offset:.78},{transform:'translateY(12px) scale(1)',opacity:0,offset:1}],600);if(!await delay(reduced.matches?0:220)||token!==generation)return;motion($('paper'),[{transform:'translateY(0)'},{transform:'translateY(3px)',offset:.3},{transform:'translateY(0)'}],280);motion($('mark'),[{opacity:.5,transform:'scale(1.15)'},{opacity:1,transform:'scale(1)'}],200);await stamp;if(token!==generation||!await delay(360)||token!==generation)return;await transition(1,token);if(token!==generation||!await delay(900)||token!==generation)return;await transition(2,token);}
async function replay(){goto(0);const token=generation;await typeCopy(0,token);}
function back(){if(step===4)return;cancel();const target=step>=2?4:0;transition(target,generation,'back');}
$('stamp').onclick=()=>{if(busy)return;cancel();stampPlan(generation);};cards.forEach((c,i)=>c.onclick=()=>{if(busy)return;if(i===selected&&step===3){videos[i].paused?playSelected(true):videos[i].pause();return;}cancel();selectPosture(i,generation);});$('back').onclick=back;
// Expanded/collapsed cards are local selection state. Both return directly home.
// The final CTA and defer label are presentation only, as requested.
videos.forEach((v,i)=>v.addEventListener('error',()=>{cards[i].querySelector('.video-message').textContent='视频加载失败，请重播';}));addEventListener('keydown',e=>{if(e.key==='Escape')back();});document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('is-paused',document.hidden);if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0;for(const a of animations)a.pause();playingBeforeHidden=videos.some(v=>!v.paused);videos.forEach(v=>v.pause());}else{for(const a of animations)a.play();if(timers.length)raf=requestAnimationFrame(pump);if(playingBeforeHidden)playSelected(true);}});addEventListener('pagehide',cancel);reduced.addEventListener('change',()=>{const current=step;goto(current);if(current===1){const token=generation;delay(900).then(ok=>{if(ok&&token===generation)transition(2,token);});}});
showPage(0);layout(false);const initial=generation;Promise.allSettled([document.fonts.ready,...[...document.images].map(i=>i.decode())]).then(()=>{if(generation===initial)replay();});
})();
</script><script>// Pointer cancellation and keyboard activation use the same MVP press feedback.
document.querySelectorAll('[data-press]').forEach(button=>{
 const surface=button.dataset.pressSurface?document.querySelector(button.dataset.pressSurface):button;
 let releaseTimer;
 const press=()=>{if(button.disabled||button.hidden||button.closest('[inert]')||document.querySelector('[aria-busy="true"]'))return;clearTimeout(releaseTimer);surface.classList.remove('is-releasing');surface.classList.add('is-pressing');};
 const release=()=>{if(!surface.classList.contains('is-pressing'))return;surface.classList.remove('is-pressing');surface.classList.add('is-releasing');releaseTimer=setTimeout(()=>surface.classList.remove('is-releasing'),320);};
 button.addEventListener('pointerdown',press);
 ['pointerup','pointercancel','pointerleave','blur'].forEach(event=>button.addEventListener(event,release));
 button.addEventListener('keydown',event=>{if(!event.repeat&&['Enter',' '].includes(event.key))press();});
 button.addEventListener('keyup',release);
});
