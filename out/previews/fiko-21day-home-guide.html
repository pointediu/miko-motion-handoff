<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miko 21天活动 · 首页入口引导</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #fff; font-family: "STBaoYuan-SC", "Yuanti SC", "PingFang SC", sans-serif; }
      button { padding: 0; border: 0; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid #006dff; outline-offset: -3px; }
      img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
      .phone {
        position: absolute; left: 50%; top: 50%; width: 393px; height: 852px;
        overflow: hidden; border-radius: 32px; outline: 1px solid #dedede; background: #fff;
        transform: translate(-50%, -50%) scale(var(--phone-scale, 1)); transform-origin: center;
      }
      .screen { position: absolute; inset: 0; }
      .screen-image { width: 393px; height: 852px; }
      .previous { z-index: 2; }
      .back { position: absolute; left: 16px; top: 48px; width: 40px; height: 40px; border-radius: 16px; background: transparent; }
      .back:active:not(:disabled) { background: rgba(0, 0, 0, 0.04); }
      .entry {
        position: absolute; right: 61px; top: 54px; width: 60px; height: 36px;
        overflow: hidden; isolation: isolate; border-radius: 14px; background: #f1f7ff;
      }
      .entry::after { content: ""; position: absolute; inset: 0; z-index: 3; border: 1px solid #ededed; border-radius: inherit; pointer-events: none; }
      .streak-button { position: absolute; left: 0; top: 0; width: 59px; height: 36px; border-radius: 14px; background: #fff; }
      .streak-button:active { background: #f5f5f5; }
      .flame { position: absolute; left: 8px; top: 6px; width: 24px; height: 24px; }
      .streak-number { position: absolute; left: 34px; top: 6px; width: 17px; height: 24px; color: #000; font-size: 16px; font-weight: 700; line-height: 24px; text-align: center; }
      .activity-label { position: absolute; left: 64px; top: 8px; width: 53px; height: 20px; opacity: 0; }
      .label-shine {
        --label-mask: url("/assets/9eac8ce54b67e5c562c64595c21052213db0d0016a9b835f48d32c60796d77aa.png");
        position: absolute; left: 64px; top: 8px; width: 53px; height: 20px;
        opacity: 0; pointer-events: none;
        background: linear-gradient(110deg, transparent 42%, #fff 50%, transparent 58%) 100% 0 / 300% 100% no-repeat;
        -webkit-mask-image: var(--label-mask); mask-image: var(--label-mask);
        -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; mask-mode: alpha;
      }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <main class="phone" data-state="calendar" aria-label="21天活动首页入口引导">
      <section class="screen home" aria-label="首页" aria-hidden="true" inert>
        <img class="screen-image" src="/assets/6921183573838b05d2f2f81256489fcba4d4f2917bb3a322f864e31b70f0709d.png" alt="Miko 首页，训练计划与本周打卡日历" />
        <div class="entry" aria-label="连胜与活动入口">
          <button class="streak-button" type="button" aria-label="打开连胜日历，连胜27天" title="打开连胜日历">
            <img class="flame" src="/assets/1838af132c3d89f5a5df5dacc5c6d248a81fc559f0e490ed7ea9e882c44fb514.png" alt="" />
            <span class="streak-number" aria-hidden="true">27</span>
          </button>
          <img class="activity-label" src="/assets/9eac8ce54b67e5c562c64595c21052213db0d0016a9b835f48d32c60796d77aa.png" alt="养人计划" aria-hidden="true" />
          <span class="label-shine" aria-hidden="true"></span>
        </div>
      </section>
      <section class="screen previous" aria-label="前置连胜日历页">
        <img class="screen-image" src="/assets/a4e7994fc6e41e44cc89c8dd7de6ab8175b9c1ccbe2385ef9dd8fd25733ee714.png" alt="连胜日历，Miko养人计划活动入口，连胜186天" />
        <button class="back" type="button" aria-label="返回首页" title="返回首页"></button>
      </section>
      <div class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script>const embeddedAssetMap={"assets/activity-label.png":"/assets/9eac8ce54b67e5c562c64595c21052213db0d0016a9b835f48d32c60796d77aa.png","assets/flame.png":"/assets/1838af132c3d89f5a5df5dacc5c6d248a81fc559f0e490ed7ea9e882c44fb514.png","assets/home.png":"/assets/6921183573838b05d2f2f81256489fcba4d4f2917bb3a322f864e31b70f0709d.png","assets/previous.png":"/assets/a4e7994fc6e41e44cc89c8dd7de6ab8175b9c1ccbe2385ef9dd8fd25733ee714.png"};function resolveAsset(assetPath){return embeddedAssetMap[assetPath]||assetPath;}</script>
    <script>
      const phone = document.querySelector(".phone");
      const previous = document.querySelector(".previous");
      const home = document.querySelector(".home");
      const back = document.querySelector(".back");
      const entry = document.querySelector(".entry");
      const streakButton = document.querySelector(".streak-button");
      const label = document.querySelector(".activity-label");
      const labelShine = document.querySelector(".label-shine");
      const status = document.querySelector('[role="status"]');
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const animations = new Set();
      const softEase = "cubic-bezier(0.4, 0, 0.2, 1)";
      const enterEase = "cubic-bezier(0.22, 1, 0.36, 1)";
      let generation = 0;

      function fitPhone() {
        document.documentElement.style.setProperty("--phone-scale", String(Math.min(1, innerWidth / 393, innerHeight / 852)));
      }

      function cancelSequence() {
        generation += 1;
        for (const animation of animations) animation.cancel();
        animations.clear();
      }

      function animate(element, keyframes, options) {
        const animation = element.animate(keyframes, { fill: "none", ...options });
        animations.add(animation);
        if (document.hidden) animation.pause();
        return animation.finished.then(() => {
          animations.delete(animation);
          return true;
        }, () => {
          animations.delete(animation);
          return false;
        });
      }

      function showHome() {
        previous.hidden = true;
        previous.inert = true;
        home.inert = false;
        home.setAttribute("aria-hidden", "false");
      }

      function finishHome(focusEntry = false) {
        cancelSequence();
        showHome();
        phone.dataset.state = "home";
        label.setAttribute("aria-hidden", "true");
        status.textContent = "活动入口已收起，首页保持静止";
        if (focusEntry) streakButton.focus({ preventScroll: true });
      }

      function reset(focusBack = false) {
        cancelSequence();
        phone.dataset.state = "calendar";
        previous.hidden = false;
        previous.inert = false;
        back.disabled = false;
        home.inert = true;
        home.setAttribute("aria-hidden", "true");
        label.setAttribute("aria-hidden", "true");
        status.textContent = "";
        if (focusBack) back.focus({ preventScroll: true });
      }

      async function returnHome() {
        if (phone.dataset.state !== "calendar") return;
        const focusEntry = back.matches(":focus-visible");
        cancelSequence();
        const run = generation;
        phone.dataset.state = "returning";
        previous.inert = true;
        back.disabled = true;
        if (reducedMotion.matches) { finishHome(focusEntry); return; }
        await animate(previous, [{ transform: "translateX(0%)" }, { transform: "translateX(100%)" }], { id: "home-return-slide", duration: 360, easing: softEase });
        if (generation !== run) return;
        showHome();
        phone.dataset.state = "guiding";
        label.setAttribute("aria-hidden", "false");
        status.textContent = "已返回首页，养人计划入口正在展开";
        if (focusEntry) streakButton.focus({ preventScroll: true });

        // The right edge stays beside the avatar; only the entry's left edge travels.
        const duration = 6140;
        const tracks = [
          animate(entry, [
            { offset: 0, width: "60px" },
            { offset: 240 / duration, width: "60px", easing: enterEase },
            { offset: 720 / duration, width: "121px" },
            { offset: 5720 / duration, width: "121px", easing: softEase },
            { offset: 1, width: "60px" },
          ], { id: "home-entry-width", duration }),
          animate(label, [
            { offset: 0, opacity: 0 },
            { offset: 240 / duration, opacity: 0, easing: enterEase },
            { offset: 720 / duration, opacity: 1 },
            { offset: 5720 / duration, opacity: 1, easing: softEase },
            { offset: 5900 / duration, opacity: 0 },
            { offset: 1, opacity: 0 },
          ], { id: "home-entry-label", duration }),
          animate(entry, [
            { offset: 0, backgroundColor: "#f1f7ff", easing: "ease-in-out" },
            { offset: 0.5, backgroundColor: "#d6e8ff", easing: "ease-in-out" },
            { offset: 1, backgroundColor: "#f1f7ff" },
          ], { id: "home-entry-breath", delay: 1020, duration: 1400, iterations: 3 }),
        ];
        for (let index = 0; index < 3; index += 1) {
          tracks.push(animate(labelShine, [
            { offset: 0, backgroundPosition: "100% 0%", opacity: 0 },
            { offset: 0.15, backgroundPosition: "85% 0%", opacity: 0.55 },
            { offset: 0.85, backgroundPosition: "15% 0%", opacity: 0.55 },
            { offset: 1, backgroundPosition: "0% 0%", opacity: 0 },
          ], { id: `home-label-shine-${index + 1}`, delay: 1020 + index * 1500, duration: 700, easing: "linear" }));
        }
        await Promise.all(tracks);
        if (generation === run) finishHome();
      }

      back.addEventListener("click", returnHome);
      streakButton.addEventListener("click", () => reset(streakButton.matches(":focus-visible")));
      reducedMotion.addEventListener("change", () => {
        if (reducedMotion.matches && ["returning", "guiding"].includes(phone.dataset.state)) finishHome(true);
      });
      document.addEventListener("visibilitychange", () => {
        for (const animation of animations) {
          if (document.hidden) animation.pause();
          else animation.play();
        }
      });
      window.addEventListener("resize", fitPhone);
      fitPhone();
      reset();
    </script>
  </body>
</html>
