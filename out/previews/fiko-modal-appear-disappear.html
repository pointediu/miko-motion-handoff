<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiko 弹窗出现与消失动画</title>
    <style>
      :root {
        --phone-w: 393px;
        --phone-h: 852px;
        --font-rounded: "Yuanti SC", "YouYuan", "PingFang SC", sans-serif;
        --mask-color: rgba(0, 0, 0, 0.55);
        --mask-in: 220ms;
        --mask-out: 190ms;
        --modal-in: 360ms;
        --modal-out: 220ms;
        --modal-ease-in: cubic-bezier(0.4, 0, 0.2, 1);
        --modal-ease-out: cubic-bezier(0.4, 0, 0.2, 1);
        --tap-ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1f1f1f;
        font-family: var(--font-rounded);
      }

      button {
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .phone {
        position: relative;
        width: var(--phone-w);
        height: var(--phone-h);
        overflow: hidden;
        border-radius: 35px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
        isolation: isolate;
      }

      .page-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        -webkit-user-drag: none;
      }

      .close-trigger {
        position: absolute;
        left: 16px;
        top: 78px;
        z-index: 2;
        width: 52px;
        height: 52px;
        border-radius: 18px;
        transform-origin: 50% 50%;
        --press-scale: 0.93;
        --press-y: 1px;
        --press-over: 1;
      }

      .close-trigger::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.06);
        opacity: 0;
        transform: scale(0.78);
        transition:
          opacity 180ms ease,
          transform 360ms var(--tap-ease);
      }

      .close-trigger:active::after,
      .close-trigger.is-tapping::after {
        opacity: 1;
        transform: scale(1);
      }

      .modal-layer {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }

      .modal-layer.is-active {
        pointer-events: auto;
      }

      .modal-layer.is-closing {
        pointer-events: none;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: var(--mask-color);
        opacity: 0;
      }

      .modal-card {
        position: absolute;
        left: 50%;
        top: 50.7%;
        width: 300px;
        height: 182px;
        opacity: 0;
        transform: translate(-50%, calc(-50% + 18px)) scale(0.96);
        transform-origin: 50% 58%;
        filter: drop-shadow(0 18px 48px rgba(0, 0, 0, 0.08));
      }

      .modal-card img {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }

      .modal-hit {
        position: absolute;
        bottom: 22px;
        height: 56px;
        border-radius: 28px;
        transform-origin: 50% 50%;
        --press-scale: 0.955;
        --press-y: 2px;
        --press-over: 1;
      }

      .modal-hit::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.08);
        opacity: 0;
        transform: scale(0.9);
        transition:
          opacity 150ms ease,
          transform 360ms var(--tap-ease);
      }

      .modal-hit:active::after,
      .modal-hit.is-tapping::after {
        opacity: 1;
        transform: scale(1);
      }

      .modal-hit.cancel {
        left: 24px;
        width: 121px;
      }

      .modal-hit.save {
        right: 24px;
        width: 121px;
      }

      .close-trigger.is-pressing,
      .modal-hit.is-pressing {
        transform: translateY(var(--press-y)) scale(var(--press-scale));
        filter: brightness(0.96);
        transition:
          transform 90ms cubic-bezier(0.2, 0, 0.2, 1),
          filter 90ms ease;
      }

      .close-trigger.is-releasing,
      .modal-hit.is-releasing {
        animation: pressRelease 320ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }

      .modal-layer.is-active .scrim {
        animation: scrimIn var(--mask-in) ease forwards;
      }

      .modal-layer.is-active .modal-card {
        animation: modalIn var(--modal-in) var(--modal-ease-in) forwards;
      }

      .modal-layer.is-closing .scrim {
        animation: scrimOut var(--mask-out) ease forwards;
      }

      .modal-layer.is-closing .modal-card {
        animation: modalOut var(--modal-out) var(--modal-ease-out) forwards;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes scrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes scrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translate(-50%, calc(-50% + 18px)) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes modalOut {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, calc(-50% + 12px)) scale(0.96);
        }
      }

      @keyframes pressRelease {
        from {
          transform: translateY(var(--press-y, 1.5px)) scale(var(--press-scale, 0.965));
          filter: brightness(0.96);
        }
        to {
          transform: translateY(0) scale(1);
          filter: brightness(1);
        }
      }

      @media (max-width: 430px) {
        body {
          background: #fff;
        }

        .phone {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="弹窗出现与消失动画预览">
      <img class="page-bg" src="../assets/9437609aa0792ca1f748610de3eeb224b91e8e1f17aef0b2789cf078b8a3864c.png" alt="" />
      <button class="close-trigger" id="closeTrigger" type="button" aria-label="关闭编辑面板">
        <span class="sr-only">打开退出确认弹窗</span>
      </button>

      <section class="modal-layer" id="modalLayer" aria-hidden="true">
        <button class="scrim" id="scrim" type="button" aria-label="关闭弹窗"></button>
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="确认退出吗">
          <img src="../assets/c4be0cf664792bc7d3cbd7a76b096cfa993087ef5a6cc1bc4d431220d0a6f97d.png" alt="" />
          <button class="modal-hit cancel" data-close-modal type="button" aria-label="取消"></button>
          <button class="modal-hit save" data-close-modal type="button" aria-label="保存并退出"></button>
        </div>
      </section>
    </main>

    <script>const embeddedAssetMap={"assets/bg.png":"../assets/9437609aa0792ca1f748610de3eeb224b91e8e1f17aef0b2789cf078b8a3864c.png","assets/modal.png":"../assets/c4be0cf664792bc7d3cbd7a76b096cfa993087ef5a6cc1bc4d431220d0a6f97d.png"};function resolveAsset(assetPath){return embeddedAssetMap[assetPath]||assetPath;}</script>
    <script>
      const modalLayer = document.querySelector("#modalLayer");
      const closeTrigger = document.querySelector("#closeTrigger");
      const scrim = document.querySelector("#scrim");
      const closeTargets = document.querySelectorAll("[data-close-modal]");
      let closeTimer = 0;
      const pressReleaseMs = 320;

      function tap(button) {
        button.classList.remove("is-tapping");
        void button.offsetWidth;
        button.classList.add("is-tapping");
        window.setTimeout(() => button.classList.remove("is-tapping"), 260);
      }

      function releasePressable(button) {
        if (!button.classList.contains("is-pressing")) return;
        button.classList.remove("is-pressing", "is-releasing");
        void button.offsetWidth;
        button.classList.add("is-releasing");
        window.setTimeout(() => button.classList.remove("is-releasing"), pressReleaseMs);
      }

      function bindPressables() {
        document.querySelectorAll(".close-trigger, .modal-hit").forEach((button) => {
          if (button.dataset.pressBound) return;
          button.dataset.pressBound = "true";
          button.addEventListener("pointerdown", (event) => {
            button.classList.remove("is-releasing");
            button.classList.add("is-pressing");
            button.setPointerCapture?.(event.pointerId);
          });
          button.addEventListener("pointerup", () => releasePressable(button));
          button.addEventListener("pointercancel", () => {
            button.classList.remove("is-pressing", "is-releasing");
          });
          button.addEventListener("pointerleave", () => {
            button.classList.remove("is-pressing");
          });
        });
      }

      function openModal() {
        window.clearTimeout(closeTimer);
        modalLayer.classList.remove("is-closing");
        modalLayer.classList.remove("is-active");
        void modalLayer.offsetWidth;
        modalLayer.classList.add("is-active");
        modalLayer.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        if (!modalLayer.classList.contains("is-active") || modalLayer.classList.contains("is-closing")) {
          return;
        }
        modalLayer.classList.add("is-closing");
        closeTimer = window.setTimeout(() => {
          modalLayer.classList.remove("is-active", "is-closing");
          modalLayer.setAttribute("aria-hidden", "true");
        }, 230);
      }

      closeTrigger.addEventListener("click", () => {
        tap(closeTrigger);
        openModal();
      });

      scrim.addEventListener("click", closeModal);

      closeTargets.forEach((button) => {
        button.addEventListener("click", () => {
          tap(button);
          window.setTimeout(closeModal, 80);
        });
      });

      bindPressables();
    </script>
  </body>
</html>
