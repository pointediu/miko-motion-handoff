<script>
(function(){
'use strict';
const M=window.RewardPopupMotion,$=id=>document.getElementById(id),canvas=$('confetti'),ctx=canvas.getContext('2d'),media=matchMedia('(prefers-reduced-motion: reduce)');

function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/393,innerHeight/852).toFixed(5));}
function render(at){
 let p=M.pose(at,reduced);if(phase==='closing'){const f=1-Math.min(closeAt/M.spec.interaction.closeDurationMs,1);p={...closingPose,cardOpacity:closingPose.cardOpacity*f,maskOpacity:closingPose.maskOpacity*f};}
 $('mask').style.opacity=p.maskOpacity;$('card').style.opacity=p.cardOpacity;$('card').style.transform=`translateY(${p.cardY}px) scale(${p.cardScale})`;
 const side=(321-p.shellWidth)/2,vertical=(415-p.shellHeight)/2;
 $('card').style.clipPath=`inset(${vertical}px ${side}px round ${p.shellRadius}px)`;
 $('content').style.opacity=p.contentOpacity;$('toastLabel').style.opacity=p.toastOpacity;$('toastLabel').style.transform=`translateY(${p.toastY||0}px)`;
 $('heading').style.opacity=p.headingOpacity;$('heading').style.transform=`translateY(${p.headingY}px)`;
 $('title').style.opacity=p.titleOpacity;$('title').style.transform=`translateY(${p.titleY}px)`;
 $('viewPrize').style.opacity=p.buttonOpacity;$('viewPrize').style.transform=`translateY(${p.buttonY}px) scale(${p.buttonScale})`;
 $('viewPrize').disabled=phase==='closing'||at<(reduced?180:M.spec.interaction.buttonReadyMs);
 $('closeReward').style.opacity=p.closeOpacity;$('closeReward').disabled=phase==='closing'||p.closeOpacity<.05||p.contentOpacity<.05;

 ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,393,852);
 if(phase==='closing'||phase==='closed')return;
 for(const q of M.particles(at,reduced)){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rotation*Math.PI/180);ctx.scale(q.scaleX,1);ctx.globalAlpha=q.opacity;ctx.fillStyle=q.color;ctx.fillRect(-q.width/2,-q.height/2,q.width,q.height);ctx.restore();}

})();
