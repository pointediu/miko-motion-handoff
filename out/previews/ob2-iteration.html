<html lang="zh-CN">

    <title>OB2期迭代</title>
    <style>
      :root {
        --phone-w: 393px;
        --phone-h: 852px;
        --ink: #050505;
        --muted: rgba(0, 0, 0, 0.3);
        --surface: #fff;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --rounded: "Yuanti SC", "STYuanti-SC", "YouYuan", "PingFang SC", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #111;
        color: var(--ink);
        font-family: var(--rounded);
      }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; user-select: none; }
      [hidden] { display: none !important; }

      .phone {
        position: relative;
        width: min(100vw, var(--phone-w));
        height: min(100vh, var(--phone-h));
        aspect-ratio: 393 / 852;
        overflow: hidden;
        border-radius: 32px;
        background: url("../assets/b7312d31c8cb08e0d9b748e9a28e7122edc01a774a1c2568a7c94eeba75d5159.png") center / cover no-repeat #f5f5f5;
      }

      .status-bar {
        position: absolute;
        z-index: 50;
        top: 0;
        left: 0;
        width: 100%;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 21px 0 22px;
        font: 700 15px/20px -apple-system, BlinkMacSystemFont, sans-serif;
        pointer-events: none;
      }
      .status-icons { display: flex; align-items: center; gap: 6px; }
      .signal { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
      .signal i { width: 3px; border-radius: 2px; background: #000; }
      .signal i:nth-child(1) { height: 5px; }
      .signal i:nth-child(2) { height: 8px; }
      .signal i:nth-child(3) { height: 11px; }
      .signal i:nth-child(4) { height: 13px; }
      .wifi { font: 900 15px/1 sans-serif; transform: rotate(90deg); }
      .battery { width: 24px; height: 12px; border: 2px solid #000; border-radius: 3px; padding: 2px; }
      .battery::before { content: ""; display: block; height: 100%; border-radius: 1px; background: #000; }

      .home-indicator {
        position: absolute;
        z-index: 60;
        left: 50%;
        bottom: 8px;
        width: 144px;
        height: 5px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.8);
        transform: translateX(-50%);
      }

      .top-controls {
        position: absolute;
        z-index: 40;
        top: 54px;
        left: 16px;
        right: 16px;
        height: 48px;
      }
      .back-button {
        position: absolute;
        top: 4px;
        left: 0;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 16px;
        background: rgba(245, 245, 245, 0.9);
        cursor: pointer;
      }
      .back-button::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 15px;
        width: 14px;
        height: 14px;
        border-left: 3px solid #000;
        border-bottom: 3px solid #000;
        border-radius: 1px;
        transform: rotate(45deg);
      }
      .progress {
        position: absolute;
        top: 21px;
        left: 81px;
        width: 200px;
        height: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(48, 48, 52, 0.05);
      }
      .progress-value {
        width: var(--progress, 0px);
        height: 100%;
        border-radius: inherit;
        background: #000;
        transition: width 480ms var(--ease);
      }

      .guide {
        position: absolute;
        z-index: 30;
        top: 133px;
        left: 16px;
        right: 16px;
        height: 80px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: opacity 260ms var(--ease), transform 460ms var(--ease);
      }
      .guide.is-hidden { opacity: 0; transform: translateY(-12px); pointer-events: none; }
      .cat {
        position: relative;
        flex: 0 0 auto;
        width: 80px;
        height: 80px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .cat img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .mouth-cover, .mouth { position: absolute; pointer-events: none; }
      .mouth-cover {
        left: 46%; top: 59.5%; width: 18px; height: 13px;
        border-radius: 50%; background: #fff;
        transform: translate(-50%, -50%) rotate(-4deg);
      }
      .mouth {
        left: 46%; top: 60%; width: 10px; height: 4px;
        border-radius: 99px; background: #050505;
        transform: translate(-50%, -50%) scaleY(0.72);
      }
      .cat.is-speaking .mouth { animation: mouthTalk 190ms steps(2, end) infinite; }
      .guide-copy {
        width: 245px;
        margin: 0;
        white-space: pre-line;
        font-weight: 900;
        line-height: 1.4;
        letter-spacing: 0;
      }
      .typed-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 130ms ease, transform 130ms ease;
      }
      .typed-char.is-visible { opacity: 1; transform: translateY(0); }
      .typed-char.line-small { font-size: 16px; }
      .typed-char.line-large { font-size: 20px; }
      .typed-char.is-shaking.is-visible {
        animation: letterShake 960ms ease-in-out infinite;
        animation-delay: var(--shake-delay, 0ms);
        transform-origin: 50% 62%;
      }

      .stage { position: absolute; z-index: 10; inset: 0; }
      .screen { position: absolute; inset: 0; }
      .screen.enter-forward { animation: enterForward 680ms var(--ease) both; }
      .screen.enter-back { animation: enterBack 680ms var(--ease) both; }
      .screen.exit-forward { animation: exitForward 240ms var(--ease) both; pointer-events: none; }
      .screen.exit-back { animation: exitBack 240ms var(--ease) both; pointer-events: none; }

      .pressable { cursor: pointer; transform-origin: center; transition: transform 300ms var(--ease), filter 300ms var(--ease); }
      .pressable.is-pressing { transform: translateY(1px) scale(0.965); filter: brightness(0.96); transition-duration: 110ms; }
      .pressable.is-releasing { animation: pressRelease 300ms var(--ease); }

      .primary {
        position: absolute;
        left: 32px;
        top: 708px;
        width: 329px;
        height: 60px;
        border: 0;
        border-radius: 26px;
        background: #000;
        color: #fff;
        font-size: 20px;
        font-weight: 900;
      }
      .primary:disabled { background: #aaa; cursor: default; }
      .secondary {
        position: absolute;
        left: 32px;
        top: 780px;
        width: 329px;
        height: 24px;
        border: 0;
        background: transparent;
        color: rgba(0, 0, 0, 0.45);
        font-size: 14px;
        font-weight: 900;
      }

      .verify-title { position: absolute; top: 144px; left: 0; width: 100%; margin: 0; text-align: center; font-size: 28px; line-height: 36px; }
      .code-row { position: absolute; top: 268px; left: 36px; width: 320px; display: flex; gap: 4px; }
      .code-cell { width: 50px; height: 74px; display: grid; place-items: center; border-radius: 20px; background: #fff; font-size: 28px; font-weight: 900; }
      .verify-button { left: 86.5px; top: 390px; width: 220px; }
      .resend { position: absolute; top: 470px; left: 48px; width: 297px; border: 0; background: none; font-size: 16px; font-weight: 900; }
      .number-pad { position: absolute; left: 0; right: 0; bottom: 0; height: 291px; padding: 15px 22px 39px; background: rgba(210, 213, 219, 0.94); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .number-pad button { border: 0; border-radius: 9px; background: #fff; font: 500 24px/1 -apple-system, sans-serif; }

      .intro-screen .primary { top: 708px; }
      .intro-content {
        position: absolute;
        top: 288px;
        left: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .intro-headline { min-height: 46px; margin: 0; font-weight: 900; line-height: 44px; white-space: nowrap; }
      .intro-headline .typed-char { font-size: 20px; vertical-align: baseline; transition-duration: 180ms; }
      .intro-headline .grow-1 { font-size: 24px; }
      .intro-headline .grow-2 { font-size: 29px; }
      .intro-headline .grow-3 { font-size: 34px; }
      .intro-subtitle { min-height: 24px; margin: -4px 0 0; font-size: 16px; font-weight: 900; }
      .intro-subtitle .typed-char { transition-duration: 170ms; }
      .intro-cat { width: 154px; height: 154px; margin-top: 2px; }
      .intro-cat .mouth-cover { width: 30px; height: 24px; }
      .intro-cat .mouth { width: 17px; height: 6px; }
      .float-in { opacity: 0; transform: translateY(40px); animation: floatIn 680ms var(--ease) forwards; animation-delay: var(--delay, 0ms); }
      .intro-screen.intro-is-leaving .intro-headline,
      .intro-screen.intro-is-leaving .intro-subtitle,
      .intro-screen.intro-is-leaving .primary {
        opacity: 0;
        transform: translateY(-8px);

      .guide.is-shared-target .cat { visibility: hidden; }
      .shared-cat-transition {
        position: absolute;
        z-index: 70;

      .form-panel { position: absolute; left: 0; right: 0; top: 230px; bottom: 84px; }

      .name-input {

      .body-picker { position: absolute; top: 0; left: 0; right: 0; height: 420px; }
      .body-figure { position: absolute; top: 152px; left: 156px; width: 81px; height: 120px; object-fit: contain; }
      .body-option {

      .body-option img {
        display: block; width: 48px; height: 48px; margin: 0 auto 3px; object-fit: contain;
        transform: scale(1.5); transform-origin: center;
      }
      .body-option span { display: block; font-size: 14px; line-height: 20px; }
      .body-option.is-selected { border-color: #000; }
      .body-option.full { top: 21px; left: 147px; }
      .body-option.arms { top: 116px; left: 32px; }
      .body-option.shoulder { top: 116px; left: 261px; }
      .body-option.core { top: 249px; left: 58px; }
      .body-option.legs { top: 249px; left: 256px; }

      .duration-list { position: absolute; top: 79px; left: 56px; width: 281px; display: grid; gap: 10px; }
      .duration-card {
        width: 281px; height: 112px; padding: 24px; display: flex; align-items: center; justify-content: space-between;
        border: 2px solid transparent; border-radius: 32px; background: #fff; text-align: left;
      }
      .duration-card.is-selected { border-color: #000; }
      .duration-card strong { display: block; font-size: 20px; line-height: 28px; }
      .duration-card small { display: block; margin-top: 4px; color: rgba(0,0,0,.3); font-size: 14px; font-weight: 900; }
      .duration-card img { width: 64px; height: 64px; object-fit: contain; }

      .condition-list { position: absolute; top: 32px; left: 56px; width: 282px; display: grid; gap: 8px; }
      .condition-item {
        position: relative; width: 282px; height: 60px; padding: 0 24px; border: 2px solid transparent;
        border-radius: 22px; background: #fff; text-align: left; font-weight: 900;
      }
      .condition-item.is-selected { border-color: #000; }
      .condition-item.is-selected::after { content: "✓"; position: absolute; top: 18px; right: 20px; font: 900 18px/1 sans-serif; }
      .no-limit { position: absolute; left: 96px; top: 384px; width: 201px; height: 48px; border: 0; border-radius: 22px; background: #000; color: #fff; font-weight: 900; }

      .toast {
        position: absolute; z-index: 80; left: 50%; bottom: 62px; padding: 11px 18px; border-radius: 20px;
        background: rgba(0,0,0,.82); color: #fff; font-size: 14px; font-weight: 900;
        opacity: 0; transform: translate(-50%, 12px); pointer-events: none;
      }
      .toast.show { animation: toastIn 1400ms var(--ease) both; }

      @keyframes mouthTalk {
        0%, 100% { height: 4px; width: 10px; transform: translate(-50%, -50%) scaleY(.72); }
        50% { height: 10px; width: 9px; transform: translate(-50%, -50%) scaleY(1); }
      }
      @keyframes letterShake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        22% { transform: translate(-.9px, .45px) rotate(-.42deg); }
        48% { transform: translate(.7px, -.7px) rotate(.34deg); }
        72% { transform: translate(-.45px, -.35px) rotate(-.22deg); }
      }
      @keyframes enterForward { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes enterBack { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes exitForward { to { opacity: 0; transform: translateY(-20px); } }
      @keyframes exitBack { to { opacity: 0; transform: translateY(20px); } }
      @keyframes floatIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes pressRelease { 0% { transform: translateY(1px) scale(.965); } 100% { transform: none; } }
      @keyframes toastIn { 0%,100% { opacity: 0; transform: translate(-50%, 12px); } 15%,82% { opacity: 1; transform: translate(-50%, 0); } }
    </style>
  </head>

    <script>
      const screens = ["verify", "intro", "name", "location", "body", "duration", "condition"];
      const progressWidths = { intro: 34, name: 47, location: 70, body: 83, duration: 161, condition: 200 };
      const guides = {
        name: { text: "欢迎加入Miko！先告诉我\n该怎么称呼你吧～", key: "该怎么称呼你" },
        location: { text: "你想在哪里开始运动？\n可多选哦～", key: "在哪里" },
        body: { text: "在家就要悄悄进步！\n你更想练到身体哪个部位？", key: "身体" },
        duration: { text: "你想每天从几分钟开始？\n运动多久都算数哦", key: "几分钟" },
        condition: { text: "开练前，先告诉我\n哪些部位目前不适合运动？", key: "哪些部位" },
      };
      const state = {
        screen: "verify",
        code: ["1", "2", "3", "1", "2", "3"],
        name: "",
        gender: null,
        locations: new Set(),
        bodyParts: new Set(),
        duration: null,
        conditions: new Set(),
      };
      const stage = document.querySelector("#stage");
      const guide = document.querySelector("#guide");
      const guideCopy = document.querySelector("#guideCopy");
      const guideCat = document.querySelector("#guideCat");
      const topControls = document.querySelector("#topControls");
      const progress = document.querySelector("#progress");
      const progressValue = document.querySelector("#progressValue");
      const backButton = document.querySelector("#backButton");
      const toast = document.querySelector("#toast");
      let typingTimers = [];
      let transitioning = false;

      const button = (label, id, disabled = false, extra = "") => `<button class="primary pressable ${extra}" id="${id}" type="button" ${disabled ? "disabled" : ""}>${label}</button>`;

      function clearTyping() {
        typingTimers.forEach(clearTimeout);
        typingTimers = [];
        guideCat.classList.remove("is-speaking");
        document.querySelector("#introCat")?.classList.remove("is-speaking");
      }

      function appendTyped(container, text, key, rich = {}, options = {}) {
        container.innerHTML = "";
        const keys = (Array.isArray(key) ? key : [key]).filter(Boolean);
        const startDelay = options.startDelay ?? 130;
        const interval = options.interval ?? 42;
        let line = 0;
        let shakeIndex = 0;
        [...text].forEach((char, index) => {
          if (char === "\n") { container.append(document.createElement("br")); line += 1; return; }
          const span = document.createElement("span");
          span.className = `typed-char ${line ? "line-large" : "line-small"}`;
          const isShaking = keys.some(word => {
            const start = text.indexOf(word);
            return start >= 0 && index >= start && index < start + word.length;
          });
          if (isShaking) {
            span.classList.add("is-shaking");
            span.style.setProperty("--shake-delay", `${shakeIndex * -200}ms`);
            shakeIndex += 1;
          }
          if (rich[index]) span.classList.add(rich[index]);
          span.textContent = char;
          container.append(span);
          typingTimers.push(setTimeout(() => span.classList.add("is-visible"), startDelay + index * interval));
        });
      }

      function typeGuide() {
        const config = guides[state.screen];
        if (!config) return;
        clearTyping();
        appendTyped(guideCopy, config.text, config.key);
        guideCat.classList.add("is-speaking");
        typingTimers.push(setTimeout(() => guideCat.classList.remove("is-speaking"), 260 + config.text.length * 42));
      }

      function typeIntro() {
        clearTyping();
        const el = document.querySelector("#introHeadline");
        const subtitle = document.querySelector("#introSubtitle");
        const text = "每天动一动，身体更健康！";
        const subtitleText = "让Miko为你安排合适的运动吧";
        const rich = {};
        const growStart = text.indexOf("更健康");
        rich[growStart] = "grow-1";
        rich[growStart + 1] = "grow-2";
        rich[growStart + 2] = "grow-3";
        const headlineStart = 650;
        const headlineInterval = 82;
        const subtitleStart = headlineStart + text.length * headlineInterval + 220;
        appendTyped(el, text, ["动一动", "更健康"], rich, { startDelay: headlineStart, interval: headlineInterval });
        appendTyped(subtitle, subtitleText, null, {}, { startDelay: subtitleStart, interval: 72 });
        const cat = document.querySelector("#introCat");
        typingTimers.push(setTimeout(() => cat.classList.add("is-speaking"), 470));
        typingTimers.push(setTimeout(() => cat.classList.remove("is-speaking"), subtitleStart + subtitleText.length * 72 + 220));
      }

      function renderVerify() {
        return `<div class="screen"><h1 class="verify-title">输入验证码</h1><div class="code-row">${state.code.map(n => `<div class="code-cell">${n}</div>`).join("")}</div>${button("验证并登录", "verifyButton", false, "verify-button")}<button class="resend pressable" id="resendButton" type="button">重新发送</button><div class="number-pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n => `<button class="pressable" type="button" ${n === "" ? "disabled" : ""}>${n}</button>`).join("")}</div></div>`;
      }

      function renderIntro() {
        return `<div class="screen intro-screen"><div class="intro-content"><h1 class="intro-headline" id="introHeadline"></h1><p class="intro-subtitle" id="introSubtitle"></p><button class="cat intro-cat pressable float-in" id="introCat" type="button" style="--delay:60ms" aria-label="重播小猫说话"><img src="../assets/a6ca19fb005c084c39746ee2e9ea555c0a3b11baeb7d33ab3d686371324c732e.png" alt="" /><span class="mouth-cover"></span><span class="mouth"></span></button></div>${button("继续", "continueButton")}</div>`;
      }

      function renderName() {
        return `<div class="screen"><div class="form-panel"><div class="field-stack"><input class="name-input" id="nameInput" maxlength="8" value="${state.name}" placeholder="我是..." /><div class="gender-row"><button class="choice-button pressable ${state.gender === "male" ? "is-selected" : ""}" data-gender="male" type="button">♂ 男生</button><button class="choice-button pressable ${state.gender === "female" ? "is-selected" : ""}" data-gender="female" type="button">♀ 女生</button></div></div></div>${button("继续", "continueButton", !(state.name.trim() && state.gender))}</div>`;
      }

      function renderLocation() {
        const items = [{key:"home",label:"⌂ 在家练一练",img:"../assets/28434ef882631dccd182eb844270c9f4cfefe246a1f3a5ea3e731e7f6b7e4d31.png"},{key:"work",label:"▣ 桌边动一动",img:"../assets/86cba56ab9c750132edfb7df549b87b54f86004e60212b77482df6d1a522ac09.png"}];
        return `<div class="screen"><div class="form-panel"><div class="location-list">${items.map(item => `<button class="location-card pressable ${state.locations.has(item.key) ? "is-selected" : ""}" data-location="${item.key}" type="button"><img src="${item.img}" alt="" /><span>${item.label}</span></button>`).join("")}</div></div>${button("继续", "continueButton", !state.locations.size)}</div>`;
      }

      function renderBody() {
        const parts = [
          ["full","全身","../assets/b67a683a74e6879d726fa767c2e4d077dfee1b2edebd2033b6be422615f8e1e7.png","../assets/3ee9bbb5983189035fc7ce87ba22f070968d157f5f152da65af07f0e31755c7b.webp"],
          ["arms","手臂上肢","../assets/2a9f5fb5be1f0e35619b51c45940de04c76c77d3e9a16307287ca81b37488cc8.png","../assets/54b2e18b6ef230b8b6e3acea7d19863bc23042fc95338ae3cbffeae588a68045.webp"],
          ["shoulder","肩颈背","../assets/188923ab2912d2c8037a006ecff4bb4cb0c988905b9ea3c545c922693975aae8.png","../assets/cefe00501eacb0f0ca8e679f97bd56878c025304aa8f504b372b9ca9d9e9b5c0.webp"],
          ["core","腰腹核心","../assets/1a2d23d8ed1fac74820724b6437bd5c061f09eb4fc6bb753b93d21d6776b0df1.png","../assets/478524e2d3472552e09367a8694a01a0176ae7bc454f771557799afa5cb56e49.webp"],
          ["legs","臀腿下肢","../assets/ae168707e4e2cbcd5c54e73ce9186d39ba80e4112cd5f185080bac474fd8c988.png","../assets/599499c913affb578a70b1977c773ae984c0eb1b6f361c47d3e95bb82e411892.webp"]
        ];
        return `<div class="screen"><div class="form-panel"><div class="body-picker"><img class="body-figure" src="../assets/98ce6a2319c1d77b7177afbd561411d9fb7dc858472485d367efd7f4ff47c9a3.png" alt="人体部位示意" />${parts.map(([key,label,still,motion]) => {
          const selected = state.bodyParts.has(key);
          return `<button class="body-option pressable ${key} ${selected ? "is-selected" : ""}" data-body="${key}" type="button"><img src="${selected ? motion : still}" data-still="${still}" data-motion="${motion}" alt="" /><span>${label}</span></button>`;
        }).join("")}</div></div>${button("继续", "continueButton", !state.bodyParts.size)}</div>`;
      }

      function renderDuration() {
        const items = [[5,"先小试一下","../assets/74d22b179b64543627600040d0b5b45ac280fdf04ebc1cbfc19d47e987612cc6.png"],[10,"可以多动动","../assets/99cb04837714bd2b5c6c5bd0c20427b63522fe4eb2d31681627b9394615dab29.png"]];
        return `<div class="screen"><div class="form-panel"><div class="duration-list">${items.map(([value,sub,img]) => `<button class="duration-card pressable ${state.duration === value ? "is-selected" : ""}" data-duration="${value}" type="button"><span><strong>${value}分钟</strong><small>“${sub}”</small></span><img src="${img}" alt="" /></button>`).join("")}</div></div>${button("继续", "continueButton", !state.duration)}</div>`;
      }

      function renderCondition() {
        const labels = ["肩/颈","腰/背","手腕/手臂","膝盖","脚踝"];
        return `<div class="screen"><div class="form-panel"><div class="condition-list">${labels.map(label => `<button class="condition-item pressable ${state.conditions.has(label) ? "is-selected" : ""}" data-condition="${label}" type="button">${label}</button>`).join("")}</div><button class="no-limit pressable" id="noLimitButton" type="button">没有不适</button></div>${button("继续", "finishButton", false)}<button class="secondary pressable" id="skipButton" type="button">稍后设置</button></div>`;
      }

      function renderScreen() {
        if (state.screen === "verify") return renderVerify();
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "name") return renderName();
        if (state.screen === "location") return renderLocation();
        if (state.screen === "body") return renderBody();
        if (state.screen === "duration") return renderDuration();
        return renderCondition();
      }

      function syncChrome({ deferTyping = false } = {}) {
        const guided = guides[state.screen];
        topControls.hidden = state.screen === "verify";
        progress.hidden = state.screen === "verify";
        guide.classList.toggle("is-hidden", !guided);
        progressValue.style.setProperty("--progress", `${progressWidths[state.screen] || 0}px`);
        if (guided && !deferTyping) typeGuide(); else clearTyping();
      }

      function mount(direction = "forward") {
        stage.innerHTML = renderScreen();
        const current = stage.firstElementChild;
        current.classList.add(direction === "back" ? "enter-back" : "enter-forward");
        syncChrome();
        bind();
        if (state.screen === "intro") requestAnimationFrame(typeIntro);
      }

      function goTo(next, direction = "forward") {
        if (transitioning || next === state.screen) return;
        transitioning = true;
        clearTyping();
        const current = stage.firstElementChild;
        current?.classList.add(direction === "back" ? "exit-back" : "exit-forward");
        setTimeout(() => {
          state.screen = next;
          mount(direction);
          transitioning = false;
        }, 240);
      }

      function transitionIntroToName() {
        if (transitioning) return;
        const source = document.querySelector("#introCat");
        const phone = document.querySelector(".phone");
        if (!source || !phone) { goTo("name"); return; }
        transitioning = true;
        clearTyping();
        const phoneRect = phone.getBoundingClientRect();
        const sourceRect = source.getBoundingClientRect();
        const clone = source.cloneNode(true);
        clone.removeAttribute("id");
        clone.className = "cat intro-cat shared-cat-transition";
        clone.style.left = `${sourceRect.left - phoneRect.left}px`;
        clone.style.top = `${sourceRect.top - phoneRect.top}px`;
        clone.style.width = `${sourceRect.width}px`;
        clone.style.height = `${sourceRect.height}px`;
        source.style.visibility = "hidden";
        phone.append(clone);
        document.querySelector(".intro-screen")?.classList.add("intro-is-leaving");
        guide.classList.add("is-shared-target");

        setTimeout(() => {
          state.screen = "name";
          stage.innerHTML = renderScreen();
          stage.firstElementChild.classList.add("enter-forward");
          syncChrome({ deferTyping: true });
          bind();
          requestAnimationFrame(() => {
            const targetRect = guideCat.getBoundingClientRect();
            clone.style.left = `${targetRect.left - phoneRect.left}px`;
            clone.style.top = `${targetRect.top - phoneRect.top}px`;
            clone.style.width = `${targetRect.width}px`;
            clone.style.height = `${targetRect.height}px`;
          });
        }, 180);

        setTimeout(() => {
          clone.remove();
          guide.classList.remove("is-shared-target");
          transitioning = false;
          typeGuide();
        }, 980);
      }

      function updateContinue(enabled) {
        const btn = document.querySelector("#continueButton");
        if (btn) btn.disabled = !enabled;
      }

      function bind() {
        document.querySelector("#verifyButton")?.addEventListener("click", () => goTo("intro"));
        document.querySelector("#resendButton")?.addEventListener("click", event => { event.currentTarget.textContent = "已重新发送"; });
        document.querySelector("#introCat")?.addEventListener("click", typeIntro);
        document.querySelector("#continueButton")?.addEventListener("click", () => {
          if (state.screen === "intro") { transitionIntroToName(); return; }
          const index = screens.indexOf(state.screen);
          if (index >= 0 && index < screens.length - 1) goTo(screens[index + 1]);
        });
        const nameInput = document.querySelector("#nameInput");
        nameInput?.addEventListener("input", event => { state.name = event.target.value; updateContinue(state.name.trim() && state.gender); });
        document.querySelectorAll("[data-gender]").forEach(el => el.addEventListener("click", () => {
          state.gender = el.dataset.gender;
          document.querySelectorAll("[data-gender]").forEach(item => item.classList.toggle("is-selected", item === el));
          updateContinue(state.name.trim() && state.gender);
        }));
        document.querySelectorAll("[data-location]").forEach(el => el.addEventListener("click", () => {
          const key = el.dataset.location;
          state.locations.has(key) ? state.locations.delete(key) : state.locations.add(key);
          el.classList.toggle("is-selected", state.locations.has(key)); updateContinue(state.locations.size);
        }));
        document.querySelectorAll("[data-body]").forEach(el => el.addEventListener("click", () => {
          const key = el.dataset.body;
          state.bodyParts.has(key) ? state.bodyParts.delete(key) : state.bodyParts.add(key);
          const selected = state.bodyParts.has(key);
          el.classList.toggle("is-selected", selected);
          const art = el.querySelector("img");
          art.src = selected ? art.dataset.motion : art.dataset.still;
          updateContinue(state.bodyParts.size);
        }));
        document.querySelectorAll("[data-duration]").forEach(el => el.addEventListener("click", () => {
          state.duration = Number(el.dataset.duration);
          document.querySelectorAll("[data-duration]").forEach(item => item.classList.toggle("is-selected", item === el)); updateContinue(true);
        }));
        document.querySelectorAll("[data-condition]").forEach(el => el.addEventListener("click", () => {
          const key = el.dataset.condition;
          state.conditions.has(key) ? state.conditions.delete(key) : state.conditions.add(key);
          el.classList.toggle("is-selected", state.conditions.has(key));
        }));
        document.querySelector("#noLimitButton")?.addEventListener("click", () => { state.conditions.clear(); document.querySelectorAll("[data-condition]").forEach(el => el.classList.remove("is-selected")); });
        const finish = () => { toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show"); };
        document.querySelector("#finishButton")?.addEventListener("click", finish);
        document.querySelector("#skipButton")?.addEventListener("click", finish);
      }

      backButton.addEventListener("click", () => {
        const index = screens.indexOf(state.screen);
        if (index > 0) goTo(screens[index - 1], "back");
      });
      guideCat.addEventListener("click", typeGuide);
      document.addEventListener("pointerdown", event => event.target.closest(".pressable:not(:disabled)")?.classList.add("is-pressing"));
      document.addEventListener("pointerup", event => {
        document.querySelectorAll(".pressable.is-pressing").forEach(el => {
          el.classList.remove("is-pressing"); el.classList.add("is-releasing");
          setTimeout(() => el.classList.remove("is-releasing"), 300);
        });
      });

      mount();
    </script>
  </body>
</html>
