<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sixteen OB Flow</title>
    <style>
      :root {
        --phone-width: 393px;
        --phone-height: 852px;
        --ink: #050505;
        --muted: #b8b8b8;
        --soft: #f4f4f4;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --font-rounded: "Yuanti SC", "YouYuan", "PingFang SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111;
        font-family: var(--font-rounded);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      [hidden] {
        display: none !important;
      }

      .phone {
        position: relative;
        width: min(100vw, var(--phone-width));
        height: min(100vh, var(--phone-height));
        aspect-ratio: 393 / 852;
        max-height: 100vh;
        overflow: hidden;
        border-radius: 32px;
        background: image-set(url("/assets/b7312d31c8cb08e0d9b748e9a28e7122edc01a774a1c2568a7c94eeba75d5159.png") 1x) center / cover no-repeat #fff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      }

      .status-bar {
        position: absolute;
        z-index: 20;
        top: 16px;
        left: 0;
        right: 0;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px 0 35px;
        pointer-events: none;
      }

      .time {
        font-size: 15px;
        line-height: 1;
        font-weight: 900;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .cellular {
        width: 18px;
        height: 14px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }

      .cellular i {
        width: 3px;
        border-radius: 2px;
        background: #000;
      }

      .cellular i:nth-child(1) { height: 5px; }
      .cellular i:nth-child(2) { height: 8px; }
      .cellular i:nth-child(3) { height: 11px; }
      .cellular i:nth-child(4) { height: 14px; }

      .wifi {
        position: relative;
        width: 18px;
        height: 14px;
      }

      .wifi::before,
      .wifi::after {
        content: "";
        position: absolute;
        left: 50%;
        border: 2.5px solid #000;
        border-bottom: 0;
        border-left-color: transparent;
        border-right-color: transparent;
        transform: translateX(-50%);
      }

      .wifi::before {
        top: 1px;
        width: 19px;
        height: 11px;
        border-radius: 18px 18px 0 0;
      }

      .wifi::after {
        top: 6px;
        width: 9px;
        height: 6px;
        border-radius: 12px 12px 0 0;
      }

      .wifi i {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #000;
        transform: translateX(-50%);
      }

      .battery {
        position: relative;
        width: 23px;
        height: 12px;
        border: 1.8px solid #000;
        border-radius: 3px;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 1px;
        background: #000;
      }

      .battery::after {
        content: "";
        position: absolute;
        top: 3px;
        right: -4px;
        width: 2px;
        height: 5px;
        border-radius: 1px;
        background: #000;
      }

      .top-controls {
        position: absolute;
        z-index: 18;
        top: 58px;
        left: 16px;
        right: 16px;
        height: 40px;
        pointer-events: none;
      }

      .back-button {
        position: absolute;
        top: 0;
        left: 0;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        box-shadow: 0 7px 20px rgba(0, 0, 0, 0.035);
        pointer-events: auto;
      }

      .back-button::before {
        content: "";
        position: absolute;
        top: 12px;
        left: 15px;
        width: 14px;
        height: 14px;
        border-left: 3px solid #000;
        border-bottom: 3px solid #000;
        border-radius: 1px;
        transform: rotate(45deg);
      }

      .progress {
        position: absolute;
        top: 17px;
        left: 81px;
        width: 200px;
        height: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: #efefef;
      }

      .progress-value {
        width: var(--progress-width, 29px);
        height: 100%;
        border-radius: inherit;
        background: #000;
        transition: width 480ms var(--ease);
      }

      .guide {
        position: absolute;
        z-index: 12;
        top: 116px;
        left: 0;
        right: 0;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .guide-cat {
        position: relative;
        width: 88px;
        height: 88px;
        flex: 0 0 88px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .guide-cat img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .mouth-cover,
      .mouth {
        position: absolute;
        pointer-events: none;
      }

      .mouth-cover {
        left: 46%;
        top: 59.5%;
        width: 20px;
        height: 15px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%) rotate(-4deg);
      }

      .mouth {
        left: 46%;
        top: 60%;
        width: 11px;
        height: 4px;
        border-radius: 999px;
        background: #050505;
        transform: translate(-50%, -50%) scaleY(0.72);
      }

      .guide-cat.is-speaking .mouth {
        animation: mouthTalk 190ms steps(2, end) infinite;
      }

      .guide-copy {
        width: 273px;
        min-height: 66px;
        margin: 0;
        white-space: pre-line;
        font-size: 16px;
        line-height: 1.42;
        font-weight: 900;
        letter-spacing: 0;
      }

      .typed-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .typed-char.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .typed-char.is-normal-line {
        font-size: 16px;
      }

      .typed-char.is-shake-line {
        font-size: 20px;
      }

      .typed-char.is-shaking.is-visible {
        animation: letterShake 960ms ease-in-out infinite;
        animation-delay: var(--shake-delay, 0ms);
        transform-origin: 50% 62%;
        will-change: transform;
      }

      .stage {
        position: absolute;
        z-index: 4;
        inset: 0;
      }

      .stage-content {
        position: absolute;
        inset: 0;
        opacity: 1;
        transform: translateY(0);
      }

      .stage-content.is-entering {
        animation: componentEnter 680ms var(--ease) both;
      }

      .stage-content.is-back-entering {
        animation: componentEnterBack 680ms var(--ease) both;
      }

      .stage-content.is-exiting {
        animation: componentExit 240ms var(--ease) both;
        pointer-events: none;
      }

      .stage-content.is-back-exiting {
        animation: componentExitBack 240ms var(--ease) both;
        pointer-events: none;
      }

      .action-area {
        position: absolute;
        z-index: 15;
        left: 0;
        right: 0;
        bottom: 30px;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .primary-button {
        width: 330px;
        height: 60px;
        border: 0;
        border-radius: 30px;
        background: #000;
        color: #fff;
        font-size: 19px;
        line-height: 1;
        font-weight: 900;
        cursor: pointer;
        box-shadow: none;
      }

      .primary-button:disabled {
        background: #b7b7b7;
        cursor: default;
      }

      .secondary-button {
        min-width: 110px;
        min-height: 22px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: #aaa;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }

      .pressable {
        position: relative;
        transform-origin: center;
        transition: transform 110ms var(--ease), filter 140ms ease;
      }

      .pressable.is-pressing,
      .pressable:active:not(:disabled) {
        transform: translateY(1px) scale(0.965);
        filter: brightness(0.96);
      }

      .pressable.is-releasing {
        animation: pressRelease 300ms var(--ease) both;
      }

      .basic-form {
        position: absolute;
        top: 285px;
        left: 56px;
        width: 281px;
      }

      .name-field {
        width: 100%;
        height: 72px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.98);
        color: #111;
        font-size: 19px;
        font-weight: 900;
        text-align: center;
        outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.025);
      }

      .name-field::placeholder {
        color: #b8b8b8;
      }

      .gender-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
        margin-top: 15px;
      }

      .gender {
        height: 73px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.98);
        color: #050505;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.025);
      }

      .gender.is-selected {
        box-shadow: inset 0 0 0 2px #050505;
      }

      .gender-symbol {
        font-size: 27px;
        line-height: 1;
      }

      .basic-continue {
        margin-top: 30px;
        width: 100%;
      }

      .fake-keyboard {
        position: absolute;
        z-index: 8;
        left: 0;
        right: 0;
        bottom: 0;
        height: 255px;
        padding: 8px 7px 26px;
        background: #d7dbe1;
      }

      .suggestions {
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        color: #333;
        font-family: "PingFang SC", sans-serif;
        font-size: 17px;
      }

      .key-row {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-bottom: 6px;
      }

      .key {
        min-width: 31px;
        height: 39px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        background: #fff;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 18px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.22);
      }

      .key.wide {
        min-width: 88px;
        font-size: 14px;
        background: #aeb4bd;
      }

      .key.space {
        width: 190px;
        font-size: 14px;
      }

      .goal-layout {
        position: absolute;
        top: 245px;
        left: 0;
        right: 0;
        height: 440px;
      }

      .goal-choice {
        position: absolute;
        width: 168px;
        height: 80px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        color: #050505;
        font-size: 17px;
        font-weight: 900;
      }

      .goal-choice::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("/assets/c27d85df247d1c05cd684e32db0091193748f7f36cbff275fefe722ec524f272.png") center / contain no-repeat;
      }

      .goal-choice.is-selected::before {
        background-image: url("/assets/29338639b7e94ddb62ff63c070c072e8795a1b2bd6f4f1c5b58c6db6bef9b74f.png");
      }

      .goal-choice.is-flipped::before {
        transform: scaleX(-1);
      }

      .goal-choice span {
        position: relative;
        z-index: 1;
        display: grid;
        height: 68px;
        place-items: center;
      }

      .goal-choice[data-goal="0"] { left: 44px; top: 12px; }
      .goal-choice[data-goal="1"] { right: 44px; top: 118px; }
      .goal-choice[data-goal="2"] { left: 82px; top: 224px; }

      .goal-character {
        position: absolute;
        width: 74px;
        height: 74px;
        object-fit: contain;
        pointer-events: none;
      }

      .goal-character[data-goal-video="0"] { left: 57px; top: 82px; }
      .goal-character[data-goal-video="1"] { right: 28px; top: 188px; }
      .goal-character[data-goal-video="2"] { left: 70px; top: 294px; }

      .day-grid {
        position: absolute;
        top: 285px;
        left: 17px;
        width: 359px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .day-row {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .day-card {
        flex: 0 0 82px;
        height: 123px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        padding-top: 27px;
        border: 0;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.98);
        color: #050505;
        font-size: 17px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.025);
      }

      .day-check {
        width: 35px;
        height: 35px;
        object-fit: contain;
        opacity: 0;
        transform: translateY(8px) scale(0.86);
        transition: opacity 340ms var(--ease), transform 500ms var(--ease);
      }

      .day-card.is-selected .day-check {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .location-grid {
        position: absolute;
        top: 236px;
        left: 45px;
        width: 303px;
        display: grid;
        gap: 12px;
      }

      .location-card {
        position: relative;
        height: 202px;
        overflow: hidden;
        border: 0;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.98);
        color: #050505;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.025);
      }

      .location-card.is-selected {
        box-shadow: inset 0 0 0 2px #050505;
      }

      .location-card video {
        position: absolute;
        top: 18px;
        left: 50%;
        width: 216px;
        height: 132px;
        object-fit: contain;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .location-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 18px;
        font-weight: 900;
      }

      .location-icon {
        position: relative;
        width: 19px;
        height: 16px;
        flex: 0 0 19px;
      }

      .location-icon.bed::before {
        content: "";
        position: absolute;
        left: 1px;
        bottom: 2px;
        width: 17px;
        height: 7px;
        border: 2px solid #000;
        border-radius: 2px 2px 0 0;
      }

      .location-icon.bed::after {
        content: "";
        position: absolute;
        left: 1px;
        bottom: 0;
        width: 19px;
        height: 2px;
        background: #000;
      }

      .location-icon.monitor::before {
        content: "";
        position: absolute;
        left: 1px;
        top: 1px;
        width: 17px;
        height: 11px;
        border: 2px solid #000;
        border-radius: 2px;
      }

      .location-icon.monitor::after {
        content: "";
        position: absolute;
        left: 7px;
        bottom: 0;
        width: 7px;
        height: 2px;
        background: #000;
      }

      .condition-list {
        position: absolute;
        top: 257px;
        left: 27px;
        width: 339px;
        display: grid;
        gap: 10px;
      }

      .condition-card {
        position: relative;
        height: 54px;
        padding: 0 54px 0 22px;
        border: 0;
        border-radius: 27px;
        background: rgba(255, 255, 255, 0.98);
        color: #050505;
        text-align: left;
        font-size: 17px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.025);
      }

      .condition-card.is-selected {
        box-shadow: inset 0 0 0 2px #050505;
      }

      .condition-card::after {
        content: "";
        position: absolute;
        top: 14px;
        right: 18px;
        width: 26px;
        height: 26px;
        background: url("/assets/91954a65d711889111ee0df5669558c94a4a294d0b70f846cd3e9e9be171da5d.png") center / contain no-repeat;
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 260ms var(--ease), transform 360ms var(--ease);
      }

      .condition-card.is-selected::after {
        opacity: 1;
        transform: scale(1);
      }

      .generating-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 20px;
      }

      .generating-screen video {
        width: 330px;
        height: 300px;
        object-fit: contain;
      }

      .generating-title {
        margin: 22px 0 8px;
        font-size: 23px;
        font-weight: 900;
      }

      .generating-subtitle {
        margin: 0;
        color: #aaa;
        font-size: 15px;
        font-weight: 800;
      }

      .pledge-guide {
        position: absolute;
        top: 106px;
        left: 0;
        right: 0;
        height: 122px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 15px;
      }

      .pledge-guide .guide-cat {
        width: 84px;
        height: 84px;
        flex-basis: 84px;
      }

      .pledge-guide-copy {
        margin: 0;
        font-size: 19px;
        line-height: 1.38;
        font-weight: 900;
        white-space: pre-line;
      }

      .pledge-restart {
        position: absolute;
        z-index: 20;
        top: 58px;
        right: 16px;
        min-width: 68px;
        height: 40px;
        padding: 0 18px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        color: #050505;
        font: inherit;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 7px 20px rgba(0, 0, 0, 0.035);
      }

      .pledge-restart:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .pledge-paper {
        position: absolute;
        top: 214px;
        left: 20px;
        width: 353px;
        height: 532px;
        padding: 42px 36px 30px;
        background: url("/assets/fbbc69979b64608c78be441a0756bb15a81c42eebf8a09df8a4831d79bcae4f9.png") center / 100% 100% no-repeat;
      }

      .pledge-paper h2 {
        margin: 0 0 32px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 900;
      }

      .pledge-row {
        margin-bottom: 22px;
      }

      .pledge-row small {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
        font-size: 13px;
        font-weight: 800;
      }

      .pledge-row strong {
        display: block;
        font-size: 16px;
        line-height: 1.25;
        font-weight: 900;
      }

      .stamp-mark {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: 88px;
        width: 108px;
        height: 108px;
        object-fit: contain;
        opacity: 0;
        transform: translateX(-50%) rotate(-5deg);
        transition: opacity 260ms var(--ease);
      }

      .stamp-mark.is-visible {
        opacity: 1;
        transform: translateX(-50%) rotate(-5deg);
      }

      .stamp-shine {
        position: absolute;
        z-index: 3;
        left: 50%;
        bottom: 88px;
        width: 108px;
        height: 108px;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%) rotate(-5deg);
        background: linear-gradient(105deg, transparent 31%, rgba(255, 255, 255, 0.92) 48%, transparent 65%);
        background-position: 145% 0;
        background-size: 300% 100%;
        -webkit-mask: url("/assets/86fe705accf30ab58cd91cc1579324aeb5f883a2203246b194b7c7616f1a27b5.png") center / contain no-repeat;
        mask: url("/assets/86fe705accf30ab58cd91cc1579324aeb5f883a2203246b194b7c7616f1a27b5.png") center / contain no-repeat;
      }

      .stamp-shine.is-sweeping {
        animation: stampShineOnce 1600ms ease-in-out 220ms both;
      }

      .stamp-motion {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 1;
        pointer-events: none;
      }

      .stamp-motion.is-playing {
        opacity: 1;
      }

      .stamp-pedestal {
        position: absolute;
        z-index: 6;
        left: 117px;
        bottom: -10px;
        width: 160px;
        height: 213px;
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        cursor: pointer;
        will-change: transform;
        transition: transform 460ms var(--ease), filter 140ms ease;
      }

      .stamp-pedestal.is-stamping,
      .stamp-pedestal.is-stamping.is-releasing {
        animation: none;
        transform: translateY(-90px);
        transition-duration: 480ms;
      }

      .stamp-pedestal video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .done-toast {
        position: absolute;
        z-index: 30;
        left: 50%;
        bottom: 174px;
        padding: 10px 18px;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        opacity: 0;

      @keyframes letterShake {

        from { opacity: 0; transform: translateY(40px); }

      }

      @keyframes componentEnterBack {
        from { opacity: 0; transform: translateY(-40px); }

      }

      @keyframes componentExit {

      let isTransitioning = false;

      function clearTyping() {
        typingTimers.forEach(window.clearTimeout);
        typingTimers = [];
        guideCat.classList.remove("is-speaking");
      }

      function typeGuide(screen = state.screen) {
        if (!guideText[screen]) return;
        clearTyping();
        const text = typeof guideText[screen] === "function" ? guideText[screen]() : guideText[screen];
        const shakingText = guideShakeText[screen] || "";
        const shakeStart = text.indexOf(shakingText);
        const shakeEnd = shakeStart + shakingText.length;
        const shakeLineIndex = text.slice(0, Math.max(0, shakeStart)).split("\n").length - 1;
        let shakeIndex = 0;
        let lineIndex = 0;
        guideCopy.innerHTML = "";
        [...text].forEach((character, index) => {
          if (character === "\n") {
            guideCopy.append(document.createElement("br"));
            lineIndex += 1;
            return;
          }
          const span = document.createElement("span");
          span.className = `typed-char ${lineIndex === shakeLineIndex ? "is-shake-line" : "is-normal-line"}`;
          if (shakeStart >= 0 && index >= shakeStart && index < shakeEnd) {
            span.classList.add("is-shaking");
            span.style.setProperty("--shake-delay", `${shakeIndex * -200}ms`);
            shakeIndex += 1;
          }
          span.textContent = character;
          guideCopy.append(span);
          typingTimers.push(window.setTimeout(() => span.classList.add("is-visible"), 130 + index * 42));
        });
        guideCat.classList.add("is-speaking");
        typingTimers.push(window.setTimeout(() => guideCat.classList.remove("is-speaking"), 260 + text.length * 42));
      }

      function playMedia(video, { loop = false, restart = false } = {}) {
        if (!video) return;
        video.dataset.mediaState = "playing";
        video.loop = loop;
        video.muted = true;
        if (restart) {
          try { video.currentTime = 0; } catch {}
        }
        const promise = video.play();
        promise?.catch(() => {});
      }

      function resetMedia(video) {
        if (!video) return;
        video.dataset.mediaState = "first-frame";
        video.loop = false;
        video.pause();
        const seekToFirstFrame = () => {
          if (video.dataset.mediaState !== "first-frame") return;
          try { video.currentTime = 0; } catch {}
        };
        if (video.readyState >= 1) seekToFirstFrame();
        else video.addEventListener("loadedmetadata", seekToFirstFrame, { once: true });
      }

            <section class="pledge-guide">
              <button class="guide-cat pressable" id="pledgeCat" type="button" aria-label="重播小猫说话"><img src="/assets/a6ca19fb005c084c39746ee2e9ea555c0a3b11baeb7d33ab3d686371324c732e.png" alt="" /><span class="mouth-cover"></span><span class="mouth"></span></button>
              <h1 class="pledge-guide-copy">计划出炉～\n敢不敢和我做个约定！</h1>
            </section>
            <section class="pledge-paper">
              <h2>我 ${state.name || "阿蛋"} 承诺...</h2>
              <div class="pledge-row"><small>目标</small><strong>我要变瘦</strong></div>
              <div class="pledge-row"><small>每周训练</small><strong>${[...state.days].join(" / ") || "周一 / 周三 / 周五"}</strong></div>
              <div class="pledge-row"><small>每日时长</small><strong>15分钟</strong></div>
              <div class="pledge-row"><small>每日目标</small><strong>150 kcal / 天</strong></div>
              <img class="stamp-mark${state.stamped ? " is-visible" : ""}" src="/assets/86fe705accf30ab58cd91cc1579324aeb5f883a2203246b194b7c7616f1a27b5.png" alt="约定盖章" />
              <span class="stamp-shine" aria-hidden="true"></span>
            </section>
            <button class="stamp-pedestal pressable${state.stamped ? " is-stamped" : ""}" id="stampButton" type="button" aria-label="${state.stamped ? "已经盖章" : "盖个章吧"}"><video class="stamp-motion" src="/assets/c45fadfccedcecfaad1738a9d1712ad4c00ac6c65781d64e7dec4e9955dedb16.webm" poster="/assets/8cacefe3871cc625f599c7b4135a5e89a74d03e3f2bbea180cb48e44946fc5f0.png" muted playsinline preload="auto"></video></button>
          </div>`;
      }

      function markupFor(screen) {
        if (screen === "basic") return renderBasic();
        if (screen === "goals") return renderGoals();
        if (screen === "days") return renderDays();
        if (screen === "location") return renderLocation();
        if (screen === "conditions") return renderConditions();
        if (screen === "generating") return renderGenerating();
        return renderPledge();
      }

      function updateChrome(screen) {
        phone.dataset.screen = screen;
        const guided = ["basic", "goals", "days", "location", "conditions"].includes(screen);
        guide.hidden = !guided;
        topControls.hidden = screen === "generating";
        progressValue.parentElement.hidden = screen === "pledge";
        progressValue.style.setProperty("--progress-width", `${progressWidths[screen] || 154}px`);
        if (guided) typeGuide(screen);
      }

      function bindPressable(button) {
        if (button.dataset.pressBound) return;
        button.dataset.pressBound = "true";
        button.addEventListener("pointerdown", event => {
          if (button.disabled) return;
          button.classList.remove("is-releasing");
          button.classList.add("is-pressing");
          button.setPointerCapture?.(event.pointerId);
        });
        const release = () => {
          if (!button.classList.contains("is-pressing")) return;
          button.classList.remove("is-pressing");
          button.classList.remove("is-releasing");
          button.offsetHeight;
          button.classList.add("is-releasing");
          window.setTimeout(() => button.classList.remove("is-releasing"), 310);
        };
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
      }

      function bindPressables(scope = document) {
        scope.querySelectorAll(".pressable").forEach(bindPressable);
      }

      function syncGoalMedia({ replay } = {}) {
        stage.querySelectorAll("[data-goal-video]").forEach(video => {
          const selected = state.goals.has(Number(video.dataset.goalVideo));
          if (selected) {
            playMedia(video, { loop: true, restart: replay === Number(video.dataset.goalVideo) });
          } else {
            resetMedia(video);
          }
        });
      }

      function syncLocationMedia({ replay } = {}) {
        stage.querySelectorAll("[data-location-video]").forEach(video => {
          const selected = state.locations.has(video.dataset.locationVideo);
          if (selected) {
            playMedia(video, { loop: true, restart: replay === video.dataset.locationVideo });
          } else {
            resetMedia(video);
          }
        });
      }

      function rerenderCurrent() {
        const node = stage.querySelector(".stage-content");
        const className = node?.className || "stage-content";
        stage.innerHTML = markupFor(state.screen);
        const next = stage.querySelector(".stage-content");
        next.className = className.replace(/\bis-(?:back-)?entering\b|\bis-(?:back-)?exiting\b/g, "").trim();
        bindStage();
      }

      function bindStage() {
        bindPressables(stage);

        const nameField = stage.querySelector("#nameField");
        nameField?.addEventListener("input", () => {
          state.name = nameField.value;
          stage.querySelector("#basicContinue").disabled = !(state.name.trim() && state.gender);
        });

        stage.querySelectorAll("[data-gender]").forEach(button => button.addEventListener("click", () => {
          state.gender = button.dataset.gender;
          stage.querySelectorAll("[data-gender]").forEach(item => item.classList.toggle("is-selected", item === button));
          stage.querySelector("#basicContinue").disabled = !(state.name.trim() && state.gender);
        }));

        stage.querySelector("#basicContinue")?.addEventListener("click", () => goTo("goals"));

        stage.querySelectorAll("[data-goal]").forEach(button => button.addEventListener("click", () => {
          const goal = Number(button.dataset.goal);
          if (state.goals.has(goal)) state.goals.delete(goal); else state.goals.add(goal);
          button.classList.toggle("is-selected", state.goals.has(goal));
          stage.querySelector("#continueButton").disabled = !state.goals.size;
          syncGoalMedia({ replay: state.goals.has(goal) ? goal : null });
        }));

        stage.querySelectorAll("[data-day]").forEach(button => button.addEventListener("click", () => {
          const day = button.dataset.day;
          if (state.days.has(day)) state.days.delete(day); else state.days.add(day);
          button.classList.toggle("is-selected", state.days.has(day));
          stage.querySelector("#continueButton").disabled = !state.days.size;
        }));

        stage.querySelectorAll("[data-location]").forEach(button => button.addEventListener("click", () => {
          const location = button.dataset.location;
          if (state.locations.has(location)) state.locations.delete(location); else state.locations.add(location);
          button.classList.toggle("is-selected", state.locations.has(location));
          stage.querySelector("#continueButton").disabled = !state.locations.size;
          syncLocationMedia({ replay: state.locations.has(location) ? location : null });
        }));

        stage.querySelectorAll("[data-condition]").forEach(button => button.addEventListener("click", () => {
          const condition = button.dataset.condition;
          if (state.conditions.has(condition)) state.conditions.delete(condition); else state.conditions.add(condition);
          button.classList.toggle("is-selected", state.conditions.has(condition));
          stage.querySelector("#continueButton").textContent = state.conditions.size ? "继续" : "暂无限制";
        }));

        stage.querySelector("#continueButton")?.addEventListener("click", () => {
          if (state.screen === "goals") goTo("days");
          else if (state.screen === "days") goTo("location");
          else if (state.screen === "location") goTo("conditions");
          else if (state.screen === "conditions") goTo("generating");
        });

        stage.querySelector("#skipButton")?.addEventListener("click", () => {
          if (state.screen === "location") goTo("conditions");
          else if (state.screen === "conditions") goTo("generating");
        });

        stage.querySelector("#pledgeCat")?.addEventListener("click", event => {
          const cat = event.currentTarget;
          cat.classList.add("is-speaking");
          window.setTimeout(() => cat.classList.remove("is-speaking"), 1000);
        });

        stage.querySelector("#stampButton")?.addEventListener("click", completeStamp);
        stage.querySelector("#pledgeRestart")?.addEventListener("click", resetStampPreview);

        if (state.screen === "goals") syncGoalMedia();
        if (state.screen === "location") syncLocationMedia();
        if (state.screen === "generating") playMedia(stage.querySelector("#generatingVideo"), { loop: true });
        if (state.screen === "pledge" && !state.stamped) resetMedia(stage.querySelector(".stamp-motion"));
      }

      async function goTo(next, direction = "forward") {
        if (isTransitioning || next === state.screen) return;
        isTransitioning = true;
        window.clearTimeout(generatingTimer);
        clearTyping();
        const current = stage.querySelector(".stage-content");
        current?.classList.add(direction === "back" ? "is-back-exiting" : "is-exiting");
        await new Promise(resolve => window.setTimeout(resolve, 240));
        state.screen = next;
        updateChrome(next);
        stage.innerHTML = markupFor(next);
        const incoming = stage.querySelector(".stage-content");
        incoming.classList.add(direction === "back" ? "is-back-entering" : "is-entering");
        bindStage();
        window.setTimeout(() => incoming.classList.remove("is-entering", "is-back-entering"), 700);
        if (next === "generating") generatingTimer = window.setTimeout(() => goTo("pledge"), 3000);
        isTransitioning = false;
      }

      function goBack() {
        const index = screens.indexOf(state.screen);
        if (index <= 0 || state.screen === "generating") return;
        goTo(screens[index - 1], "back");
      }

      function resetStampPreview() {
        if (!state.stamped) return;
        const video = stage.querySelector(".stamp-motion");
        const mark = stage.querySelector(".stamp-mark");
        const shine = stage.querySelector(".stamp-shine");
        const button = stage.querySelector("#stampButton");
        const restartButton = stage.querySelector("#pledgeRestart");
        state.stamped = false;
        doneToast.classList.remove("is-visible");
        mark?.classList.remove("is-visible");
        shine?.classList.remove("is-sweeping");
        button?.classList.remove("is-stamped", "is-stamping", "is-pressing", "is-releasing");
        if (button) {
          button.disabled = false;
          button.setAttribute("aria-label", "盖个章吧");
        }
        if (restartButton) restartButton.disabled = true;
        resetMedia(video);
      }

      function completeStamp() {
        if (state.stamped) {
          window.clearTimeout(toastTimer);
          doneToast.classList.add("is-visible");
          toastTimer = window.setTimeout(() => doneToast.classList.remove("is-visible"), 1200);
          return;
        }
        state.stamped = true;
        const video = stage.querySelector(".stamp-motion");
        const mark = stage.querySelector(".stamp-mark");
        const shine = stage.querySelector(".stamp-shine");
        const button = stage.querySelector("#stampButton");
        const restartButton = stage.querySelector("#pledgeRestart");
        let finished = false;
        let fallbackTimer = 0;
        let liftFallbackTimer = 0;
        let videoStarted = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          window.clearTimeout(fallbackTimer);
          window.clearTimeout(liftFallbackTimer);
          video.removeEventListener("ended", finish);
          video.classList.remove("is-playing");
          button.classList.remove("is-stamping");
          mark.classList.add("is-visible");
          shine?.classList.remove("is-sweeping");
          void shine?.offsetWidth;
          shine?.classList.add("is-sweeping");
          button.classList.add("is-stamped");
          button.disabled = false;
          button.setAttribute("aria-label", "已经盖章");
          if (restartButton) restartButton.disabled = false;
        };
        const startVideo = () => {
          if (videoStarted) return;
          videoStarted = true;
          window.clearTimeout(liftFallbackTimer);
          button.classList.add("is-stamping");
          video.classList.add("is-playing");
          video.defaultPlaybackRate = 2;
          video.playbackRate = 2;
          video.addEventListener("ended", finish, { once: true });
          playMedia(video, { restart: true });
          fallbackTimer = window.setTimeout(finish, 1800);
        };
        button.disabled = true;
        button.classList.remove("is-pressing", "is-releasing");
        const liftAnimation = button.animate(
          [
            { transform: "translateY(0px) scale(1)" },
            { transform: "translateY(-90px) scale(1)" },
          ],
          {
            duration: 480,
            easing: "cubic-bezier(0.4, 0, 0.2, 1)",
            fill: "forwards",
          },
        );
        liftAnimation.addEventListener("finish", () => {
          button.classList.add("is-stamping");
          liftAnimation.cancel();
          startVideo();
        }, { once: true });
        liftFallbackTimer = window.setTimeout(() => {
          button.classList.add("is-stamping");
          liftAnimation.cancel();
          startVideo();
        }, 620);
      }

      backButton.addEventListener("click", goBack);
      guideCat.addEventListener("click", () => typeGuide());
      bindPressable(backButton);
      bindPressable(guideCat);
      stage.innerHTML = renderBasic();
      bindStage();
      updateChrome("basic");
    </script>
  </body>
</html>
