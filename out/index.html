<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiko / Sixteen 动效交付工具（单文件版）</title>
    <style>
      :root {
        --bg: #f6f6f3;
        --panel: #fff;
        --ink: #111;
        --muted: rgba(17, 17, 17, 0.56);
        --line: rgba(17, 17, 17, 0.1);
        --soft: rgba(17, 17, 17, 0.045);
        --active: #050505;
        --radius: 14px;
        --font-rounded: "Yuanti SC", "YouYuan", "PingFang SC", sans-serif;
        --preview-scale: 1;
        --warning-height: 44px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-rounded);
      }

      button,
      iframe {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        min-height: calc(100vh - var(--warning-height));
        display: grid;
        grid-template-columns: 250px minmax(430px, 1fr) 390px;
      }

      .handoff-warning {
        min-height: var(--warning-height);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e31818;
        color: #fff;
        text-align: center;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 900;
        letter-spacing: 0;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
      }

      .sidebar,
      .details {
        height: calc(100vh - var(--warning-height));
        overflow: auto;
        background: var(--panel);
      }

      .sidebar {
        border-right: 1px solid var(--line);
        padding: 20px 14px;
      }

      .brand {
        padding: 0 8px 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand h1 {
        margin: 0 0 7px;
        font-size: 21px;
        line-height: 1.15;
        font-weight: 900;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        font-weight: 700;
      }

      .nav-list {
        display: grid;
        gap: 8px;
        padding: 16px 0 0;
      }

      .nav-group {
        display: grid;
        gap: 8px;
      }

      .nav-group-toggle {
        width: 100%;
        min-height: 58px;
        display: grid;
        grid-template-columns: 1fr 18px;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .nav-group-toggle:hover {
        background: var(--soft);
      }

      .nav-group-toggle:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .nav-group--drafts {
        margin-top: 12px;
        padding-left: 8px;
        border-left: 3px solid #bd697c;
        background: #fff3f5;
      }

      .nav-group--drafts .nav-group-toggle {
        border-color: #eacbd3;
        background: #fff3f5;
        color: #843d50;
      }

      .nav-group--drafts .nav-group-toggle:hover {
        background: #fbe7ec;
      }

      .nav-group--drafts .nav-group-copy small {
        color: #98586a;
      }

      .nav-group--drafts .nav-group-items {
        border-left-color: #eacbd3;
      }

      .nav-group-copy {
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .nav-group-copy strong {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 14px;
        line-height: 1.25;
        font-weight: 900;
      }

      #v130GroupToggle .nav-group-copy strong,
      #activity21GroupToggle .nav-group-copy strong {
        color: #006dff;
      }

      .nav-group-new {
        flex: none;
        padding: 3px 5px;
        border-radius: 4px;
        background: #006dff;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 9px;
        line-height: 1;
        font-weight: 800;
        white-space: nowrap;
      }

      .nav-group-copy small {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.25;
        font-weight: 700;
      }

      .nav-group-chevron {
        width: 9px;
        height: 9px;
        justify-self: center;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg) translate(-2px, -2px);
        transition: transform 260ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-group-toggle[aria-expanded="true"] .nav-group-chevron {
        transform: rotate(225deg) translate(-1px, -1px);
      }

      .nav-group-panel {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transform: translateY(-4px);
        transition: grid-template-rows 300ms cubic-bezier(0.4, 0, 0.2, 1), opacity 220ms ease-in-out, transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-group-panel.is-expanded {
        grid-template-rows: 1fr;
        opacity: 1;
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .nav-group-panel,
        .nav-group-chevron {
          transition: none;
        }
      }

      .nav-group-items {
        min-height: 0;
        overflow: hidden;
        display: grid;
        gap: 8px;
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }

      .nav-item {
        width: 100%;
        display: grid;
        gap: 5px;
        padding: 12px 12px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .nav-item:hover {
        background: var(--soft);
      }

      .nav-item.is-active {
        border-color: var(--active);
        background: var(--active);
        color: #fff;
      }

      .nav-item strong {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 14px;
        line-height: 1.25;
        font-weight: 900;
      }

      .nav-status {
        padding: 3px 5px;
        border: 1px solid #e8aa54;
        border-radius: 4px;
        background: #fff2d8;
        color: #7a4300;
        font-size: 9px;
        line-height: 1;
        font-weight: 900;
        white-space: nowrap;
      }

      .nav-item span {
        color: currentColor;
        opacity: 0.58;
        font-size: 11px;
        line-height: 1.35;
        font-weight: 700;
      }

      .preview {
        min-width: 0;
        height: calc(100vh - var(--warning-height));
        display: grid;
        grid-template-rows: auto 1fr;
        background: #fff;
      }

      .toolbar {
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1.1;
        font-weight: 900;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .action {
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
      }

      .action:hover {
        border-color: rgba(17, 17, 17, 0.28);
      }

      .stage {
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 24px;
        background: #fff;
      }

      .device-wrap {
        width: calc(393px * var(--preview-scale));
        height: calc(852px * var(--preview-scale));
        position: relative;
      }

      .device {
        position: absolute;
        left: 0;
        top: 0;
        width: 393px;
        height: 852px;
        border: 1px solid #d8d8d8;
        border-radius: 32px;
        background: #fff;
        box-shadow: none;
        transform: scale(var(--preview-scale));
        transform-origin: left top;
      }

      .details {
        border-left: 1px solid var(--line);
        padding: 20px;
      }

      .details-head {
        display: grid;
        gap: 9px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .details-head h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.18;
        font-weight: 900;
      }

      .details-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        font-weight: 700;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        padding: 5px 8px;
        border-radius: 999px;
        background: var(--soft);
        color: rgba(17, 17, 17, 0.68);
        font-size: 11px;
        line-height: 1;
        font-weight: 900;
      }

      .tag-status {
        border: 1px solid #e8aa54;
        border-radius: 4px;
        background: #fff2d8;
        color: #7a4300;
      }

      .params {
        display: grid;
        gap: 16px;
        padding: 18px 0 28px;
      }

      .preview-settings {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .preview-settings[hidden] { display: none; }

      .setting-days-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 13px; font-weight: 800; }
      .setting-days-value { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
      .setting-days-value input { width: 66px; height: 36px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: #111; font: 700 14px system-ui, sans-serif; }
      .setting-days-range { display: block; width: 100%; height: 28px; margin: 8px 0 0; accent-color: #006dff; cursor: pointer; }
      .setting-date-label { display: block; font-size: 13px; font-weight: 800; }
      .setting-date-select { display: block; width: 100%; min-height: 40px; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: #111; font: 700 14px system-ui, sans-serif; }
      .setting-date-select:focus-visible { outline: 2px solid #006dff; outline-offset: 3px; }
      .setting-days-value input:focus-visible, .setting-days-range:focus-visible { outline: 2px solid #006dff; outline-offset: 3px; }

      .setting-toggle {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }

      .setting-toggle input {
        appearance: none;
        flex: 0 0 40px;
        width: 40px;
        height: 24px;
        margin: 0;
        border: 1px solid #aaa;
        border-radius: 24px;
        background: #ddd;
        cursor: pointer;
      }

      .setting-toggle input::before {
        content: "";
        display: block;
        width: 18px;
        height: 18px;
        margin: 2px;
        border-radius: 50%;
        background: #fff;
      }

      .setting-toggle input:checked { background: #111; border-color: #111; }
      .setting-toggle input:checked::before { transform: translateX(16px); }
      .setting-toggle input:focus-visible { outline: 2px solid #3578d4; outline-offset: 3px; }

      .param-section {
        display: grid;
        gap: 9px;
      }

      .param-section h3 {
        margin: 0;
        font-size: 13px;
        line-height: 1.2;
        font-weight: 900;
      }

      .param-table {
        display: grid;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }

      .param-row {
        display: grid;
        grid-template-columns: 116px 1fr;
        border-top: 1px solid var(--line);
      }

      .param-row:first-child {
        border-top: 0;
      }

      .param-key,
      .param-value {
        padding: 9px 10px;
        font-size: 12px;
        line-height: 1.45;
      }

      .param-key {
        color: var(--muted);
        font-weight: 900;
        background: rgba(17, 17, 17, 0.025);
      }

      .param-value {
        font-weight: 700;
        word-break: break-word;
      }

      .code {
        display: block;
        margin: 0;
        padding: 12px;
        overflow: auto;
        border-radius: 12px;
        background: #151515;
        color: #f3f1e8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .swift-note {
        display: grid;
        gap: 6px;
        padding: 12px;
        border: 1px solid rgba(17, 17, 17, 0.12);
        border-radius: 12px;
        background: rgba(5, 5, 5, 0.035);
        color: rgba(17, 17, 17, 0.72);
        font-size: 12px;
        line-height: 1.55;
        font-weight: 800;
      }

      .swift-note strong {
        color: var(--ink);
        font-size: 13px;
        font-weight: 900;
      }

      .copy-state {
        min-height: 18px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 220px minmax(390px, 1fr);
        }

        .details {
          grid-column: 1 / -1;
          height: auto;
          max-height: none;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="handoff-warning" role="status">非完整的UI呈现，研发同学请只参考动画效果</div>
    <main class="app">
      <aside class="sidebar">
        <section class="brand">
          <h1>动效交付工具</h1>
          <p>左侧选择动画，中间预览，右侧查看 SwiftUI 研发实现参数。</p>
        </section>
        <nav class="nav-list" id="navList" aria-label="动画列表"></nav>
      </aside>

      <section class="preview">
        <header class="toolbar">
          <div>
            <h2 id="previewTitle"></h2>
          </div>
          <div class="actions">
            <button class="action" id="reloadButton" type="button">重播 / 刷新</button>
            <a class="action" id="openButton" target="_blank" rel="noreferrer">打开单页</a>
          </div>
        </header>
        <div class="stage" id="stage">
          <div class="device-wrap" id="deviceWrap">
            <iframe class="device" id="previewFrame" title="动画预览"></iframe>
          </div>
        </div>
      </section>

      <aside class="details">
        <section class="details-head">
          <h2 id="detailTitle"></h2>
          <p id="detailDescription"></p>
          <div class="tag-row" id="tagRow"></div>
          <button class="action" id="copyButton" type="button">复制 SwiftUI 参数 JSON</button>
          <div class="copy-state" id="copyState"></div>
        </section>
        <section class="preview-settings" id="makeupSettings" hidden aria-label="补签动画设置">
          <label class="setting-toggle" for="neighborImpactToggle">
            <span>章和圆点微震</span>
            <input id="neighborImpactToggle" type="checkbox" role="switch" checked />
          </label>
        </section>
        <section class="preview-settings" id="activity21Settings" hidden aria-label="21天活动状态设置">
          <div class="setting-days-row">
            <label for="activityCheckedDays">已打卡天数</label>
            <div class="setting-days-value">
              <input id="activityCheckedDays" type="number" min="0" max="21" step="1" value="0" inputmode="numeric" />
              <span>/ 21 天</span>
            </div>
          </div>
          <input class="setting-days-range" id="activityCheckedDaysRange" type="range" min="0" max="21" step="1" value="0" aria-label="已打卡天数滑块" aria-valuetext="已打卡 0 天，共 21 天" />
        </section>
        <section class="preview-settings" id="activityStampSettings" hidden aria-label="练后盖章日期设置">
          <label class="setting-date-label" for="activityStampDay">盖章日期</label>
          <select class="setting-date-select" id="activityStampDay"></select>
        </section>
        <div class="params" id="params"></div>
      </aside>
    </main>

    <script>

      const animations = [
        {
          id: "fiko-btn-click-standard",
          title: "Btn 点击规范",
          group: "Fiko 通用",
          path: "animations/fiko-btn-click-standard/index.html",
          description:
            "单独展示所有可点击元素的统一点击态：按下快速收缩、轻微下沉和降亮，松开后柔和缓入缓出恢复。",
          tags: ["点击态", "通用规范", "缓入缓出"],
          sections: [
            {
              title: "统一触发",
              rows: [
                ["适用范围", "所有 button / 可点击卡片 / 圆形 icon / 胶囊日期 / 猫猫头 / 透明热区"],
                ["按下触发", "pointerdown 添加 is-pressing"],
                ["松开触发", "pointerup 移除 is-pressing，添加 is-releasing"],
                ["取消触发", "pointercancel / pointerleave 移除 is-pressing"],
                ["禁用态", "disabled / hidden 不触发"],
              ],
            },
            {
              title: "按下态",
              rows: [
                ["时长", "90ms"],
                ["缓动", "cubic-bezier(0.2, 0, 0.2, 1)"],
                ["默认变化", "translateY(1.5px); scale(0.965); brightness(0.96)"],
                ["大 CTA", "translateY(2px); scale(0.955); brightness(0.94)"],
                ["圆形 icon", "translateY(1px); scale(0.93)"],
                ["卡片", "translateY(2px); scale(0.972)"],
                ["猫猫头", "translateY(1px); scale(0.965)"],
              ],
            },
            {
              title: "松开恢复",
              rows: [
                ["时长", "320ms"],
                ["缓动", "cubic-bezier(0.4, 0, 0.2, 1)"],
                ["0%", "保持按下态"],
                ["100%", "translateY(0); scale(1)"],
              ],
            },
            {
              title: "实现备注",
              rows: [
                ["透明热区", "不缩底图，只显示 rgba(0,0,0,0.035~0.052) 软遮罩"],
                ["滑杆", "不缩整条轨道，只缩 thumb 到 scale(0.94)"],
                ["设计稿坐标", "组件按 393×852 还原：猫猫头 16,125；更多按钮 323,375；卡片 426/542/658/746；CTA 87,713"],
                ["代码入口", "bindPressables() / releasePressable()"],
                ["源文件", "outputs/fiko-btn-click-standard/index.html"],
              ],
            },
          ],
          spec: {
            classNames: {
              pressing: "is-pressing",
              releasing: "is-releasing",
            },
            pressDown: {
              durationMs: 90,
              easing: "cubic-bezier(0.2, 0, 0.2, 1)",
              default: { translateY: 1.5, scale: 0.965, brightness: 0.96 },
              variants: {
                cta: { translateY: 2, scale: 0.955, brightness: 0.94 },
                icon: { translateY: 1, scale: 0.93, brightness: 0.96 },
                card: { translateY: 2, scale: 0.972, brightness: 0.96 },
                pill: { translateY: 1, scale: 0.94, brightness: 0.96 },
                cat: { translateY: 1, scale: 0.965, brightness: 0.96 },
              },
            },
            release: {
              durationMs: 320,
              easing: "cubic-bezier(0.4, 0, 0.2, 1)",
              keyframes: [
                { pct: 0, state: "pressDown" },
                { pct: 100, translateY: 0, scale: 1, brightness: 1 },
              ],
            },
            transparentHitArea: {
              useScale: false,
              overlay: "rgba(0,0,0,0.035~0.052)",
              overlayReleaseMs: 320,
            },
            slider: {
              trackScale: 1,
              thumbPressedScale: 0.94,
            },
          },
        },
        {
          id: "fiko-top-cat-talk",
          title: "顶部小猫说话",
          group: "Fiko 首页",
          path: "animations/fiko-top-cat-talk/index.html",
          description:
            "顶部小猫嘴动，气泡文案逐字出现。点击猫和气泡区域可重播。",
          tags: ["嘴动", "逐字出现", "点击重播"],
          sections: [
            {
              title: "触发与时序",
              rows: [
                ["触发", "页面 load 自动播放；点击 .talk-hotspot 重播"],
                ["点击态", "透明热区使用 Btn 点击规范的轻遮罩反馈"],
                ["首字延迟", "240ms"],
                ["逐字间隔", "72ms / 字"],
                ["单字入场", "opacity 0→1，translateY(4px→0)，130ms ease"],
                ["猫嘴停止", "700ms + 字数 × 72ms"],
              ],
            },
            {
              title: "猫嘴动画",
              rows: [
                ["CSS class", ".talk-hotspot.is-speaking ~ .mouth"],
                ["循环节奏", "190ms steps(2, end) infinite"],
                ["嘴位置", "left: 59px; top: 164px"],
                ["遮罩", "16×18px 白色圆角遮罩，覆盖原静态嘴"],
              ],
            },
            {
              title: "实现备注",
              rows: [
                ["文案", "还没有动起来吗？躺平不如动起来！今日运动计划已准备！"],
                ["字体", "Yuanti SC / YouYuan / PingFang SC"],
                ["源文件", "outputs/fiko-top-cat-talk/index.html"],
              ],
            },
          ],
          spec: {
            typewriter: {
              startDelayMs: 240,
              charIntervalMs: 72,
              charTransitionMs: 130,
              from: { opacity: 0, translateY: 4 },
              to: { opacity: 1, translateY: 0 },
            },
            mouth: {
              durationMs: 190,
              easing: "steps(2, end)",
              iteration: "infinite while typing",
              stopDelayFormula: "700 + charCount * 72",
            },

          .replace(/translate\(\s*([^,\)]+)\s*,\s*([^)]+)\)/g, (_match, x, y) => `.offset(x: ${toPointText(x)}, y: ${toPointText(y)})`)
          .replace(/translateX\(([^)]+)\)/g, (_match, x) => `.offset(x: ${toPointText(x)})`)
          .replace(/translateY\(([^)]+)\)/g, (_match, y) => `.offset(y: ${toPointText(y)})`)
          .replace(/translateY\s*=\s*-\(finalTop\s*\+\s*190px\)/g, ".offset(y: -(finalTop + 190pt))")
          .replace(/translateY\s+(-?[0-9.]+pt?→?-?[0-9.]*pt?)/g, (_match, y) => `.offset(y: ${toPointText(y)})`)
          .replace(/translateY\s+(-?[0-9.]+)\b/g, (_match, y) => `.offset(y: ${y}pt)`)
          .replace(/scaleX\(([^)]+)\)\s*scaleY\(([^)]+)\)/g, (_match, x, y) => `.scaleEffect(x: ${x.trim()}, y: ${y.trim()})`)
          .replace(/scaleX\s+([0-9.-]+)\s*\/\s*scaleY\s+([0-9.-]+)/g, (_match, x, y) => `.scaleEffect(x: ${x}, y: ${y})`)
          .replace(/scale\(([^)]+)\)/g, (_match, scale) => `.scaleEffect(${scale.trim()})`)
          .replace(/rotate\((-?[0-9.]+)deg\)/g, (_match, deg) => `.rotationEffect(.degrees(${deg}))`)
          .replace(/opacity\s+([0-9.]+(?:→[0-9.]+)?)/g, (_match, opacity) => `.opacity(${opacity})`)
          .replace(/brightness\(([0-9.]+)\)/g, (_match, brightness) => {
            const swiftBrightness = Number.parseFloat(brightness) - 1;
            return `.brightness(${swiftBrightness.toFixed(2)})`;
          })
          .replace(/JS requestAnimationFrame/g, "SwiftUI TimelineView(.animation) / CADisplayLink")
          .replace(/requestAnimationFrame/g, "TimelineView(.animation) / CADisplayLink")
          .replace(/SVG circle/g, "SwiftUI Canvas circle")
          .replace(/动态生成 SVG/g, "SwiftUI Canvas 动态绘制")
          .replace(/\bDOM\b/g, "SwiftUI View");

        return value;
      }

      function swiftifyValue(value) {
        if (typeof value === "string") {
          return swiftifyText(value);
        }

        if (Array.isArray(value)) {
          return value.map((item) => swiftifyValue(item));
        }

        if (value && typeof value === "object") {
          return Object.fromEntries(
            Object.entries(value).map(([key, nestedValue]) => [key, swiftifyValue(nestedValue)])
          );
        }

        return value;
      }

      function buildSwiftUIPayload(animation) {
        const spec = swiftifyValue(animation.spec);
        if (animation.id === "fiko-21day-activity") spec.previewState.checkedDays = activityCheckedDays;
        if (animation.id === "fiko-21day-training-stamp") {
          spec.previewState.stampDay = activityStampDay;
          spec.checkin.targetDate = `2026-10-${String(activityStampDay).padStart(2, "0")}`;
          spec.checkin.weekday = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date(Date.UTC(2026, 9, activityStampDay)).getUTCDay()];
          spec.checkin.checkedDays = [activityStampDay - 1, activityStampDay];
          spec.checkin.earnedPrizes = spec.checkin.prizeDates.filter((day) => day <= activityStampDay);
          const slot = activityStampDay + 2;
          spec.stamp.centerPt = [57.5 + (slot % 7) * 46, 354.544 + Math.floor(slot / 7) * 78];
        }
        if (animation.id === "fiko-makeup-checkin") {
          spec.neighborImpact.enabled = neighborImpactEnabled;
          spec.timeline.completeMs = neighborImpactEnabled ? 2494 : 2424;
        }
        return {
          target: "SwiftUI",
          title: animation.title,
          group: animation.group,
          status: animation.status || "已定稿",
          description: animation.description,
          previewPath: animation.path,
          tags: animation.tags,
          units: {
            duration: "milliseconds in JSON; convert to seconds for SwiftUI Animation duration",
            distance: "points",
            rotation: "degrees",
          },
          implementationMapping: {
            easing: "CSS cubic-bezier(x1,y1,x2,y2) => Animation.timingCurve(x1, y1, x2, y2, duration: seconds)",
            opacity: "View.opacity(value)",
            translateX: "View.offset(x: value)",
            translateY: "View.offset(y: value)",
            translateXY: "View.offset(x: value, y: value)",
            scale: "View.scaleEffect(value) or View.scaleEffect(x:y:)",
            rotate: "View.rotationEffect(.degrees(value))",
            brightness: "Use View.brightness(value - 1) or a pressed overlay when visual parity matters",
            frameLoop: "Use TimelineView(.animation), Canvas, or CADisplayLink for particle / physics / dot-grid wave animations",
          },
          sections: animation.sections.map((section) => ({
            title: section.title,
            rows: section.rows.map(([key, value]) => [key, swiftifyText(value)]),
          })),
          spec,
        };
      }

      function renderDetails(animation) {
        const swiftPayload = buildSwiftUIPayload(animation);
        makeupSettings.hidden = animation.id !== "fiko-makeup-checkin";
        neighborImpactToggle.checked = neighborImpactEnabled;
        activity21Settings.hidden = animation.id !== "fiko-21day-activity";
        activityStampSettings.hidden = animation.id !== "fiko-21day-training-stamp";
        activityStampDaySelect.value = String(activityStampDay);
        renderActivityDaysControl();
        detailTitle.textContent = animation.title;
        detailDescription.textContent = animation.description;
        tagRow.innerHTML = `${animation.status ? `<span class="tag tag-status">${animation.status}</span>` : ""}${animation.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}`;

        const sections = swiftPayload.sections
          .map(
            (section) => `
              <section class="param-section">
                <h3>${section.title}</h3>
                <div class="param-table">
                  ${section.rows
                    .map(
                      ([key, value]) => `
                        <div class="param-row">
                          <div class="param-key">${key}</div>
                          <div class="param-value">${escapeHtml(value)}</div>
                        </div>`
                    )
                    .join("")}
                </div>
              </section>`
          )
          .join("");

        params.innerHTML = `<section class="param-section">
            <div class="swift-note">
              <strong>SwiftUI 研发口径</strong>
              <span>时长 / 延迟在 JSON 中仍保留 ms，SwiftUI 实现时换算成秒。位移单位按 pt 理解；贝塞尔统一使用 Animation.timingCurve(x1, y1, x2, y2, duration:)。</span>
              <span>复杂物理、点阵波浪、粒子类动画建议用 TimelineView(.animation) / Canvas / CADisplayLink 实现，不按 CSS 关键帧复刻。</span>
            </div>
          </section>${sections}
          <section class="param-section">
            <h3>SwiftUI 参数 JSON</h3>
            <pre class="code">${escapeHtml(JSON.stringify(swiftPayload, null, 2))}</pre>
          </section>`;
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function selectAnimation(id) {
        current = animations.find((item) => item.id === id) || animations[0];
        const group = navGroups.find((item) => item.animationIds.includes(current.id));
        if (group) setGroupExpanded(group.key, true);
        previewTitle.textContent = current.title;
        loadPreview();
        updateOpenButton();
        renderDetails(current);
        copyState.textContent = "";

        navList.querySelectorAll(".nav-item").forEach((button) => {
          const active = button.dataset.id === current.id;
          button.classList.toggle("is-active", active);
          if (active) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
      }

      reloadButton.addEventListener("click", loadPreview);
      previewFrame.addEventListener("load", syncMakeupSettings);
      previewFrame.addEventListener("load", () => syncActivityDays());
      previewFrame.addEventListener("load", syncActivityStampDay);
      window.addEventListener("message", (event) => {
        if (event.source === previewFrame.contentWindow && event.data?.type === "fiko-makeup-ready") syncMakeupSettings();
        if (event.source === previewFrame.contentWindow && event.data?.type === "fiko-21day-ready") syncActivityDays();
        if (event.source === previewFrame.contentWindow && event.data?.type === "fiko-21day-stamp-ready") syncActivityStampDay();
      });
      activityStampDaySelect.addEventListener("change", () => {
        if (current.id !== "fiko-21day-training-stamp") return;
        const nextDay = Number(activityStampDaySelect.value);
        if (!Number.isInteger(nextDay) || nextDay < 1 || nextDay > 31) return;
        activityStampDay = nextDay;
        try { window.localStorage.setItem(activityStampStorageKey, String(activityStampDay)); }
        catch (_error) { /* Keep the date for this session when storage is unavailable. */ }
        syncActivityStampDay();
        updateOpenButton();
        renderDetails(current);
        copyState.textContent = "";
      });
      for (const control of [activityCheckedDaysInput, activityCheckedDaysRange]) {
        control.addEventListener("input", () => {
          if (current.id !== "fiko-21day-activity" || !Number.isFinite(control.valueAsNumber)) return;
          activityCheckedDays = Math.max(0, Math.min(21, Math.trunc(control.valueAsNumber)));
          renderActivityDaysControl();
          try { window.localStorage.setItem(activityDaysStorageKey, String(activityCheckedDays)); }
          catch (_error) { /* Keep the setting for this session when storage is unavailable. */ }
          syncActivityDays(true);
          copyState.textContent = "";
        });
        control.addEventListener("change", () => {
          if (current.id !== "fiko-21day-activity") return;
          updateOpenButton();
          renderDetails(current);
        });
        control.addEventListener("blur", renderActivityDaysControl);
      }
      neighborImpactToggle.addEventListener("change", () => {
        neighborImpactEnabled = neighborImpactToggle.checked;
        try { window.localStorage.setItem(neighborImpactStorageKey, String(neighborImpactEnabled)); }
        catch (_error) { /* Keep the setting for this session when storage is unavailable. */ }
        syncMakeupSettings();
        updateOpenButton();
        renderDetails(current);
        copyState.textContent = "";
      });

      copyButton.addEventListener("click", async () => {
        const payload = buildSwiftUIPayload(current);
        const text = JSON.stringify(payload, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          copyState.textContent = "已复制 SwiftUI 参数。";
        } catch (_error) {
          copyState.textContent = "当前浏览器不允许直接复制，可手动复制下方 JSON。";
        }
      });

      window.addEventListener("resize", fitPreview);

      renderNav();
      fitPreview();
      selectAnimation(current.id);
    </script>
  </body>
</html>
